name: Amazon Offer Repeat Test

on:
  workflow_dispatch:

jobs:
  amazon-repeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Amazon repeat offer test
        run: |
          cat > amazon_repeat_test.py <<'PY'
          import re
          import asyncio
          from playwright.async_api import async_playwright

          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          ZIP_CODE = "00100"
          TARGET_PRICE = "55,00"
          TARGET_SELLER = "giocagio"
          ATTEMPTS = 5


          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()


          async def handle_continue(page):
              buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              count = await buttons.count()

              for i in range(count):
                  try:
                      button = buttons.nth(i)

                      if await button.is_visible():
                          print("CLICK: Continua con gli acquisti")
                          await button.click()
                          await page.wait_for_timeout(5000)
                          return True

                  except Exception as e:
                      print("Continue click error:", repr(e))

              return False


          async def set_delivery_zip(page):
              delivery = page.locator("#glow-ingress-block")

              if await delivery.count() == 0:
                  print("ERROR: delivery block not found")
                  return False

              print(
                  "DELIVERY BEFORE:",
                  clean(await delivery.first.inner_text())
              )

              await delivery.first.click()
              await page.wait_for_timeout(2000)

              zip_input = page.locator("#GLUXZipUpdateInput")

              if await zip_input.count() == 0:
                  print("ERROR: ZIP input not found")
                  return False

              await zip_input.fill(ZIP_CODE)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              )

              if await confirm.count() == 0:
                  print("ERROR: ZIP confirm button not found")
                  return False

              await confirm.first.click()
              await page.wait_for_timeout(3000)

              confirmation = page.locator(
                  "#GLUXZipConfirmationValue"
              )

              if await confirmation.count() > 0:
                  print(
                      "CONFIRMED ZIP:",
                      clean(await confirmation.first.inner_text())
                  )

              return True


          async def get_offer_url(page):
              offer_link = page.locator(
                  "a[href*='/gp/offer-listing/B0H9HFPRRD']"
              )

              if await offer_link.count() == 0:
                  print("ERROR: purchase options link not found")
                  return None

              href = await offer_link.first.get_attribute("href")

              if not href:
                  print("ERROR: empty offer href")
                  return None

              if href.startswith("/"):
                  href = "https://www.amazon.it" + href

              return href


          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)

                  context = await browser.new_context(
                      locale="it-IT",
                      viewport={"width": 1440, "height": 1200}
                  )

                  page = await context.new_page()

                  print("=" * 80)
                  print("1. OPEN AMAZON")
                  print("=" * 80)

                  await page.goto(
                      "https://www.amazon.it/",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  await page.wait_for_timeout(5000)

                  print("URL:", page.url)
                  print("TITLE:", await page.title())

                  await handle_continue(page)

                  print("=" * 80)
                  print("2. SET DELIVERY")
                  print("=" * 80)

                  if not await set_delivery_zip(page):
                      await browser.close()
                      raise SystemExit(1)

                  print("=" * 80)
                  print("3. OPEN PRODUCT")
                  print("=" * 80)

                  await page.goto(
                      PRODUCT_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  await page.wait_for_timeout(5000)

                  print("PRODUCT URL:", page.url)
                  print(
                      "PRODUCT TITLE:",
                      clean(await page.title())
                  )

                  product_title = page.locator("#productTitle")

                  if await product_title.count() == 0:
                      print("ERROR: product page not detected")

                      await page.screenshot(
                          path="amazon-product-error.png",
                          full_page=True
                      )

                      await browser.close()
                      raise SystemExit(1)

                  delivery = page.locator("#glow-ingress-block")

                  if await delivery.count() > 0:
                      print(
                          "PRODUCT DELIVERY:",
                          clean(await delivery.first.inner_text())
                      )

                  print("=" * 80)
                  print("4. GET OFFER PAGE")
                  print("=" * 80)

                  offer_url = await get_offer_url(page)

                  if not offer_url:
                      await browser.close()
                      raise SystemExit(1)

                  print("OFFER URL:", offer_url)

                  offers_page = await context.new_page()

                  print("")
                  print("=" * 80)
                  print("5. REPEAT OFFER PAGE")
                  print("=" * 80)

                  found_target = False

                  for attempt in range(1, ATTEMPTS + 1):

                      print("")
                      print("#" * 80)
                      print(f"ATTEMPT {attempt}/{ATTEMPTS}")
                      print("#" * 80)

                      try:
                          await offers_page.goto(
                              offer_url,
                              wait_until="domcontentloaded",
                              timeout=60000
                          )

                          await offers_page.wait_for_timeout(5000)

                          print(
                              "URL:",
                              offers_page.url
                          )

                          offers = offers_page.locator(
                              "div#aod-offer"
                          )

                          offer_count = await offers.count()

                          print(
                              "REAL OFFER COUNT:",
                              offer_count
                          )

                          if offer_count == 0:
                              print(
                                  "NO OFFER CONTAINERS FOUND"
                              )
                              continue

                          minimum_price = None

                          for i in range(offer_count):

                              offer = offers.nth(i)

                              price_locator = offer.locator(
                                  "#aod-offer-price"
                              )

                              seller_locator = offer.locator(
                                  "#aod-offer-soldBy"
                              )

                              if await price_locator.count() > 0:
                                  price = clean(
                                      await price_locator.first.inner_text()
                                  )
                              else:
                                  price = ""

                              if await seller_locator.count() > 0:
                                  seller = clean(
                                      await seller_locator.first.inner_text()
                                  )
                              else:
                                  seller = ""

                              print(
                                  f"OFFER {i + 1}: "
                                  f"{price} | {seller}"
                              )

                              # Individua il prezzo numerico
                              # per trovare il minimo.
                              match = re.search(
                                  r"(\d+)[,.](\d{2})",
                                  price
                              )

                              if match:
                                  numeric = float(
                                      match.group(1)
                                      + "."
                                      + match.group(2)
                                  )

                                  if (
                                      minimum_price is None
                                      or numeric < minimum_price
                                  ):
                                      minimum_price = numeric

                              if (
                                  TARGET_PRICE in price
                                  and TARGET_SELLER.lower()
                                  in seller.lower()
                              ):
                                  found_target = True

                                  print("")
                                  print(
                                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                                  )
                                  print(
                                      "TARGET 55 EURO FOUND!"
                                  )
                                  print(
                                      "OFFER:",
                                      i + 1
                                  )
                                  print(
                                      "PRICE:",
                                      price
                                  )
                                  print(
                                      "SELLER:",
                                      seller
                                  )
                                  print(
                                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                                  )

                          if minimum_price is not None:
                              print(
                                  "MINIMUM PRICE THIS ATTEMPT:",
                                  f"{minimum_price:.2f} EUR"
                              )

                          if found_target:
                              print(
                                  "TARGET FOUND - STOPPING TEST"
                              )
                              break

                      except Exception as e:
                          print(
                              "ATTEMPT ERROR:",
                              repr(e)
                          )

                  print("")
                  print("=" * 80)
                  print("6. FINAL RESULT")
                  print("=" * 80)

                  if found_target:
                      print(
                          "55 EURO / GIOCAGIO FOUND: TRUE"
                      )
                  else:
                      print(
                          "55 EURO / GIOCAGIO FOUND: FALSE"
                      )

                  await offers_page.screenshot(
                      path="amazon-repeat-final.png",
                      full_page=True
                  )

                  await browser.close()

                  if not found_target:
                      raise SystemExit(1)


          if __name__ == "__main__":
              asyncio.run(main())
          PY

          python amazon_repeat_test.py

      - name: Upload Amazon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-repeat-diagnostics
          path: |
            amazon-repeat-final.png
            amazon-product-error.png
          if-no-files-found: ignore
