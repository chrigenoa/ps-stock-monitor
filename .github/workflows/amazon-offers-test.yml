name: Amazon Offers Diagnostic

on:
  workflow_dispatch:

jobs:
  amazon-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnose Amazon offers
        run: |
          cat > amazon_diagnostic.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re

          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          ZIP_CODE = "00100"

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def print_matches(body, keyword):
              print()
              print("-" * 80)
              print("KEYWORD:", repr(keyword))
              print("-" * 80)

              found = False

              for i, line in enumerate(body.splitlines()):
                  line_clean = clean(line)

                  if keyword.lower() in line_clean.lower():
                      found = True

                      print()
                      print("MATCH:", repr(line_clean[:2000]))

                      # Print nearby lines too
                      lines = body.splitlines()
                      start = max(0, i - 3)
                      end = min(len(lines), i + 4)

                      print("CONTEXT:")
                      for context_line in lines[start:end]:
                          context_clean = clean(context_line)

                          if context_clean:
                              print(" ", context_clean[:2000])

              if not found:
                  print("NOT FOUND")

          with sync_playwright() as p:

              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("1. OPEN AMAZON")
              print("=" * 80)

              response = page.goto(
                  "https://www.amazon.it/",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print(
                  "HTTP:",
                  response.status if response else "NONE"
              )

              print("URL:", page.url)
              print("TITLE:", page.title())

              page.wait_for_timeout(3000)

              continue_buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              if continue_buttons.count() > 0:

                  print(
                      "CONTINUE BUTTONS:",
                      continue_buttons.count()
                  )

                  for i in range(continue_buttons.count()):

                      try:
                          button = continue_buttons.nth(i)

                          if button.is_visible():

                              print(
                                  "CLICKING CONTINUE BUTTON:",
                                  i
                              )

                              button.click()

                              page.wait_for_timeout(5000)

                              break

                      except Exception as e:
                          print(
                              "CONTINUE CLICK ERROR:",
                              repr(e)
                          )

              print()
              print("=" * 80)
              print("2. SET DELIVERY ZIP")
              print("=" * 80)

              ingress = page.locator(
                  "#glow-ingress-block"
              )

              print(
                  "DELIVERY BLOCK COUNT:",
                  ingress.count()
              )

              if ingress.count() == 0:
                  print("ERROR: DELIVERY BLOCK NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print(
                  "DELIVERY BEFORE:",
                  repr(
                      clean(
                          ingress.first.inner_text()
                      )
                  )
              )

              ingress.first.click()

              page.wait_for_timeout(1500)

              zip_input = page.locator(
                  "#GLUXZipUpdateInput"
              )

              print(
                  "ZIP INPUT COUNT:",
                  zip_input.count()
              )

              if zip_input.count() == 0:
                  print("ERROR: ZIP INPUT NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              zip_input.fill(ZIP_CODE)

              print(
                  "ZIP FILLED:",
                  ZIP_CODE
              )

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              )

              print(
                  "ZIP CONFIRM COUNT:",
                  confirm.count()
              )

              if confirm.count() == 0:
                  print("ERROR: ZIP CONFIRM NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print(
                  "ZIP CONFIRM VISIBLE:",
                  confirm.first.is_visible()
              )

              print(
                  "ZIP CONFIRM DISABLED:",
                  confirm.first.is_disabled()
              )

              confirm.first.click()

              page.wait_for_timeout(3000)

              confirmation = page.locator(
                  "#GLUXZipConfirmationValue"
              )

              print(
                  "CONFIRMATION COUNT:",
                  confirmation.count()
              )

              if confirmation.count() > 0:

                  print(
                      "CONFIRMED ZIP:",
                      repr(
                          clean(
                              confirmation.first.inner_text()
                          )
                      )
                  )

              print()
              print("=" * 80)
              print("3. OPEN PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print(
                  "PRODUCT URL:",
                  page.url
              )

              print(
                  "PRODUCT TITLE PAGE:",
                  page.title()
              )

              product_title = page.locator(
                  "#productTitle"
              )

              print(
                  "PRODUCT TITLE COUNT:",
                  product_title.count()
              )

              if product_title.count() > 0:

                  print(
                      "PRODUCT:",
                      clean(
                          product_title.first.inner_text()
                      )
                  )

              delivery = page.locator(
                  "#glow-ingress-block"
              )

              print(
                  "DELIVERY BLOCK COUNT:",
                  delivery.count()
              )

              if delivery.count() > 0:

                  print(
                      "DELIVERY ON PRODUCT:",
                      repr(
                          clean(
                              delivery.first.inner_text()
                          )
                      )
                  )

              print()
              print("=" * 80)
              print("4. FIND PURCHASE OPTIONS LINK")
              print("=" * 80)

              offer_links = page.locator(
                  "a[href*='/gp/offer-listing/B0H9HFPRRD/']"
              )

              print(
                  "OFFER LINK COUNT:",
                  offer_links.count()
              )

              if offer_links.count() == 0:

                  print(
                      "ERROR: OFFER LINK NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              for i in range(offer_links.count()):

                  try:

                      print()
                      print(
                          "OFFER LINK",
                          i
                      )

                      print(
                          "TEXT:",
                          repr(
                              clean(
                                  offer_links.nth(i).inner_text()
                              )
                          )
                      )

                      print(
                          "HREF:",
                          offer_links.nth(i).get_attribute(
                              "href"
                          )
                      )

                  except Exception:
                      pass

              href = offer_links.first.get_attribute(
                  "href"
              )

              offer_url = (
                  "https://www.amazon.it"
                  + href
                  if href.startswith("/")
                  else href
              )

              print()
              print(
                  "OFFER URL:",
                  offer_url
              )

              print()
              print("=" * 80)
              print("5. OPEN OFFER PAGE")
              print("=" * 80)

              offer_page = context.new_page()

              offer_response = offer_page.goto(
                  offer_url,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print(
                  "HTTP:",
                  offer_response.status
                  if offer_response
                  else "NONE"
              )

              print(
                  "FINAL URL:",
                  offer_page.url
              )

              print(
                  "TITLE:",
                  offer_page.title()
              )

              offer_page.wait_for_timeout(5000)

              body = offer_page.locator(
                  "body"
              ).inner_text()

              print()
              print("=" * 80)
              print("6. BASIC OFFER PAGE INFORMATION")
              print("=" * 80)

              print(
                  "BODY LENGTH:",
                  len(body)
              )

              print(
                  "DELIVERY BLOCK COUNT:",
                  offer_page.locator(
                      "#glow-ingress-block"
                  ).count()
              )

              delivery_offer = offer_page.locator(
                  "#glow-ingress-block"
              )

              if delivery_offer.count() > 0:

                  print(
                      "DELIVERY:",
                      repr(
                          clean(
                              delivery_offer.first.inner_text()
                          )
                      )
                  )

              print()
              print(
                  "PRODUCT TITLE COUNT:",
                  offer_page.locator(
                      "#productTitle"
                  ).count()
              )

              print(
                  "BUYBOX COUNT:",
                  offer_page.locator(
                      "#buybox"
                  ).count()
              )

              print()
              print("=" * 80)
              print("7. SEARCH 55 EURO")
              print("=" * 80)

              print_matches(
                  body,
                  "55"
              )

              print_matches(
                  body,
                  "55,00"
              )

              print_matches(
                  body,
                  "55,00€"
              )

              print_matches(
                  body,
                  "EUR 55"
              )

              print()
              print("=" * 80)
              print("8. SEARCH PURCHASE WORDS")
              print("=" * 80)

              for keyword in [
                  "Aggiungi al carrello",
                  "Acquista ora",
                  "Disponibile",
                  "Disponibilità",
                  "giocagio",
                  "Venditore",
                  "Speditore",
                  "Opzioni di acquisto",
                  "6 opzioni",
                  "7 opzioni",
              ]:

                  print_matches(
                      body,
                      keyword
                  )

              print()
              print("=" * 80)
              print("9. ALL PRICE-LIKE TEXT")
              print("=" * 80)

              price_patterns = [
                  r"\d{1,4},\d{2}\s*€",
                  r"€\s*\d{1,4},\d{2}",
                  r"EUR\s*\d{1,4}(?:,\d{2})?",
              ]

              price_seen = set()

              for pattern in price_patterns:

                  matches = re.findall(
                      pattern,
                      body,
                      flags=re.IGNORECASE
                  )

                  for match in matches:

                      match_clean = clean(match)

                      if match_clean not in price_seen:

                          price_seen.add(
                              match_clean
                          )

                          print(
                              "PRICE:",
                              repr(match_clean)
                          )

              if not price_seen:

                  print(
                      "NO PRICE-LIKE TEXT FOUND"
                  )

              print()
              print("=" * 80)
              print("10. GIOCAGIO CONTAINERS")
              print("=" * 80)

              containers = offer_page.locator(
                  "div, article, li"
              )

              found_containers = 0

              for i in range(
                  min(
                      containers.count(),
                      4000
                  )
              ):

                  try:

                      element = containers.nth(i)

                      if not element.is_visible():
                          continue

                      text = clean(
                          element.inner_text()
                      )

                      lower = text.lower()

                      if (
                          "giocagio" not in lower
                          and "55,00" not in lower
                      ):
                          continue

                      if len(text) > 5000:
                          continue

                      found_containers += 1

                      print()
                      print(
                          "CONTAINER",
                          found_containers
                      )

                      print(
                          text[:4000]
                      )

                      if found_containers >= 20:
                          break

                  except Exception:
                      pass

              if found_containers == 0:

                  print(
                      "NO RELEVANT CONTAINERS FOUND"
                  )

              print()
              print("=" * 80)
              print("11. FIRST 15000 CHARACTERS OF PAGE")
              print("=" * 80)

              print(
                  body[:15000]
              )

              print()
              print("=" * 80)
              print("12. FINAL")
              print("=" * 80)

              print(
                  "Diagnostic completed."
              )

              browser.close()
          PY

          python amazon_diagnostic.py
