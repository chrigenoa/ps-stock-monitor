name: Amazon Offer Test

on:
  workflow_dispatch:

jobs:
  amazon-offer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon offer
        run: |
          cat > amazon_offer_test.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          ZIP_CODE = "00100"
          TARGET_PRICE = "55,00"
          TARGET_SELLER = "giocagio"

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale="it-IT",
                  viewport={"width": 1440, "height": 1200}
              )

              page = context.new_page()

              print("=" * 80)
              print("1. OPEN AMAZON")
              print("=" * 80)

              page.goto("https://www.amazon.it/", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(5000)

              print("URL:", page.url)
              print("TITLE:", await page.title())

              # Gestione pagina intermedia "Continua con gli acquisti"
              continue_buttons = page.get_by_text("Continua con gli acquisti", exact=True)

              if await continue_buttons.count() > 0:
                  clicked = False

                  for i in range(await continue_buttons.count()):
                      try:
                          if await continue_buttons.nth(i).is_visible():
                              print("Click 'Continua con gli acquisti'")
                              await continue_buttons.nth(i).click()
                              clicked = True
                              break
                      except Exception:
                          pass

                  if clicked:
                      await page.wait_for_timeout(5000)

              print("URL AFTER CONTINUE:", page.url)

              print("=" * 80)
              print("2. SET ITALIAN ZIP CODE")
              print("=" * 80)

              delivery = page.locator("#glow-ingress-block")

              if await delivery.count() == 0:
                  print("ERROR: delivery block not found")
                  await page.screenshot(path="amazon-error-delivery.png", full_page=True)
                  raise SystemExit(1)

              await delivery.click()
              await page.wait_for_timeout(2000)

              zip_input = page.locator("#GLUXZipUpdateInput")

              if await zip_input.count() == 0:
                  print("ERROR: ZIP input not found")
                  raise SystemExit(1)

              print("ZIP INPUT FOUND")

              await zip_input.fill(ZIP_CODE)

              confirm_zip = page.locator("#GLUXZipInputSection input[type='submit']")

              print("ZIP CONFIRM COUNT:", await confirm_zip.count())

              if await confirm_zip.count() == 0:
                  print("ERROR: ZIP confirm button not found")
                  raise SystemExit(1)

              print("ZIP CONFIRM VISIBLE:", await confirm_zip.first.is_visible())
              print("ZIP CONFIRM DISABLED:", await confirm_zip.first.is_disabled())

              await confirm_zip.first.click()
              await page.wait_for_timeout(3000)

              confirmed = page.locator("#GLUXZipConfirmationValue")

              print(
                  "CONFIRMED ZIP:",
                  clean(await confirmed.inner_text()) if await confirmed.count() else "NOT FOUND"
              )

              # Non forziamo il pulsante "Continua":
              # Amazon in questa sessione può chiudere il popup automaticamente.
              try:
                  close_button = page.locator("#GLUXConfirmClose")

                  if await close_button.count() > 0 and await close_button.first.is_visible():
                      print("Click GLUXConfirmClose")
                      await close_button.first.click()
                      await page.wait_for_timeout(3000)
              except Exception:
                  pass

              print("=" * 80)
              print("3. OPEN PRODUCT")
              print("=" * 80)

              await page.goto(PRODUCT_URL, wait_until="domcontentloaded", timeout=60000)
              await page.wait_for_timeout(5000)

              print("PRODUCT URL:", page.url)
              print("PRODUCT TITLE:", clean(await page.title()))

              product_title = page.locator("#productTitle")

              print(
                  "PRODUCT TITLE ELEMENTS:",
                  await product_title.count()
              )

              delivery = page.locator("#glow-ingress-block")

              if await delivery.count() > 0:
                  print("DELIVERY:")
                  print(clean(await delivery.first.inner_text()))

              print("=" * 80)
              print("4. OPEN PURCHASE OPTIONS")
              print("=" * 80)

              offer_link = page.locator(
                  "a[href*='/gp/offer-listing/B0H9HFPRRD']"
              )

              print("OFFER LINK COUNT:", await offer_link.count())

              if await offer_link.count() == 0:
                  print("ERROR: purchase options link not found")
                  await page.screenshot(
                      path="amazon-no-offer-link.png",
                      full_page=True
                  )
                  raise SystemExit(1)

              offer_url = await offer_link.first.get_attribute("href")

              print("OFFER LINK:", offer_url)

              if offer_url and offer_url.startswith("/"):
                  offer_url = "https://www.amazon.it" + offer_url

              if not offer_url:
                  print("ERROR: empty offer URL")
                  raise SystemExit(1)

              offers_page = await context.new_page()

              await offers_page.goto(
                  offer_url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              await offers_page.wait_for_timeout(5000)

              print("OFFERS URL:", offers_page.url)
              print("OFFERS TITLE:", clean(await offers_page.title()))

              print("=" * 80)
              print("5. READ ALL REAL OFFERS")
              print("=" * 80)

              # Gli elementi con id=aod-offer sono i contenitori reali
              # delle singole offerte.
              offers = offers_page.locator("div#aod-offer")

              offer_count = await offers.count()

              print("REAL OFFER CONTAINERS:", offer_count)

              target_offer = None
              target_index = None

              for i in range(offer_count):
                  offer = offers.nth(i)

                  try:
                      text = clean(await offer.inner_text())
                  except Exception:
                      text = ""

                  price = ""
                  seller = ""

                  price_locator = offer.locator("#aod-offer-price")
                  seller_locator = offer.locator("#aod-offer-soldBy")

                  if await price_locator.count() > 0:
                      price = clean(await price_locator.first.inner_text())

                  if await seller_locator.count() > 0:
                      seller = clean(await seller_locator.first.inner_text())

                  print("")
                  print("-" * 80)
                  print(f"OFFER {i + 1}")
                  print("PRICE:", price)
                  print("SELLER:", seller)
                  print("TEXT:", text[:1000])

                  # Il pulsante deve appartenere allo STESSO contenitore.
                  button = offer.locator(
                      "span.aod-atc-generic-btn-desktop"
                  )

                  if await button.count() > 0:
                      print("ADD TO CART BUTTONS:", await button.count())

                      for b in range(await button.count()):
                          try:
                              print(
                                  " BUTTON",
                                  b + 1,
                                  "VISIBLE:",
                                  await button.nth(b).is_visible(),
                                  "ID:",
                                  await button.nth(b).get_attribute("id")
                              )
                          except Exception:
                              pass
                  else:
                      print("ADD TO CART BUTTONS: 0")

                  # Ricerca dell'offerta target.
                  #
                  # Usiamo sia prezzo sia venditore.
                  # Il controllo del testo completo serve come fallback
                  # nel caso Amazon modifichi la struttura interna.
                  price_match = (
                      TARGET_PRICE in price
                      or TARGET_PRICE in text
                      or "55 €" in price
                      or "55,00 €" in text
                  )

                  seller_match = (
                      TARGET_SELLER.lower() in seller.lower()
                      or TARGET_SELLER.lower() in text.lower()
                  )

                  if price_match and seller_match:
                      target_offer = offer
                      target_index = i
                      print("")
                      print("******** TARGET OFFER FOUND ********")
                      print("OFFER NUMBER:", i + 1)
                      print("PRICE:", price)
                      print("SELLER:", seller)
                      print("************************************")

              print("=" * 80)
              print("6. TARGET RESULT")
              print("=" * 80)

              if target_offer is None:
                  print("TARGET 55 EURO OFFER FOUND: False")
                  print("")
                  print("The current Amazon session does NOT show")
                  print("55,00 EUR from seller giocagio.")
                  print("")
                  print("This does NOT prove the offer never existed.")
                  print("It means it is not present in this session.")
                  print("")
                  print("AVAILABLE OFFERS IN THIS SESSION:")
                  for i in range(offer_count):
                      offer = offers.nth(i)

                      try:
                          price_locator = offer.locator("#aod-offer-price")
                          seller_locator = offer.locator("#aod-offer-soldBy")

                          price = (
                              clean(await price_locator.first.inner_text())
                              if await price_locator.count()
                              else ""
                          )

                          seller = (
                              clean(await seller_locator.first.inner_text())
                              if await seller_locator.count()
                              else ""
                          )

                          print(
                              f"  OFFER {i + 1}: {price} | {seller}"
                          )
                      except Exception:
                          pass

                  await offers_page.screenshot(
                      path="amazon-offers-current.png",
                      full_page=True
                  )

                  raise SystemExit(1)

              print("TARGET 55 EURO OFFER FOUND: True")

              print("=" * 80)
              print("7. CLICK TARGET OFFER")
              print("=" * 80)

              target_button = target_offer.locator(
                  "span.aod-atc-generic-btn-desktop"
              ).first

              if await target_button.count() == 0:
                  print("ERROR: target add-to-cart button not found")
                  raise SystemExit(1)

              print(
                  "TARGET BUTTON ID:",
                  await target_button.get_attribute("id")
              )

              print(
                  "TARGET BUTTON VISIBLE:",
                  await target_button.is_visible()
              )

              # Il vero elemento cliccabile può essere un antenato dello span.
              clickable = target_button.locator(
                  "xpath=ancestor::*[self::span or self::button or self::form][1]"
              )

              print("CLICKABLE COUNT:", await clickable.count())

              before_url = offers_page.url

              try:
                  await target_button.click(timeout=15000)
              except Exception as e:
                  print("DIRECT SPAN CLICK FAILED:", repr(e))

                  # Fallback: click sul contenitore a-button.
                  parent_button = target_button.locator(
                      "xpath=ancestor::span[contains(@class,'a-button')][1]"
                  )

                  if await parent_button.count() > 0:
                      print("TRY PARENT A-BUTTON")
                      await parent_button.click(timeout=15000)
                  else:
                      raise

              await offers_page.wait_for_timeout(5000)

              print("URL BEFORE CLICK:", before_url)
              print("URL AFTER CLICK:", offers_page.url)

              print("=" * 80)
              print("8. CHECK AFTER CLICK")
              print("=" * 80)

              body_text = clean(await offers_page.locator("body").inner_text())

              print("PAGE TITLE:", clean(await offers_page.title()))

              for keyword in [
                  "Aggiunto al carrello",
                  "Aggiunto",
                  "carrello",
                  "55,00",
                  "giocagio",
                  "Pokémon"
              ]:
                  print(
                      f"KEYWORD '{keyword}':",
                      keyword.lower() in body_text.lower()
                  )

              print("")
              print("BODY RELEVANT TEXT:")

              lines = [
                  clean(x)
                  for x in (await offers_page.locator("body").inner_text()).splitlines()
                  if clean(x)
              ]

              for line in lines:
                  low = line.lower()

                  if any(
                      k in low
                      for k in [
                          "aggiunto",
                          "carrello",
                          "55,00",
                          "giocagio",
                          "pokémon"
                      ]
                  ):
                      print(line[:500])

              print("=" * 80)
              print("9. OPEN CART")
              print("=" * 80)

              cart_page = await context.new_page()

              await cart_page.goto(
                  "https://www.amazon.it/gp/cart/view.html",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              await cart_page.wait_for_timeout(5000)

              print("CART URL:", cart_page.url)
              print("CART TITLE:", clean(await cart_page.title()))

              cart_text = clean(await cart_page.locator("body").inner_text())

              print("=" * 80)
              print("10. CART VERIFICATION")
              print("=" * 80)

              checks = {
                  "ASIN": "B0H9HFPRRD",
                  "55,00": "55,00",
                  "giocagio": "giocagio",
                  "Pokémon": "Pokémon",
              }

              for label, value in checks.items():
                  print(
                      f"{label}:",
                      value.lower() in cart_text.lower()
                  )

              print("")
              print("CART RELEVANT TEXT:")

              cart_lines = [
                  clean(x)
                  for x in (await cart_page.locator("body").inner_text()).splitlines()
                  if clean(x)
              ]

              for line in cart_lines:
                  low = line.lower()

                  if any(
                      k in low
                      for k in [
                          "pokémon",
                          "55,00",
                          "giocagio",
                          "carrello",
                          "quantità"
                      ]
                  ):
                      print(line[:500])

              print("")
              print("=" * 80)
              print("TEST FINISHED")
              print("=" * 80)

              await offers_page.screenshot(
                  path="amazon-after-click.png",
                  full_page=True
              )

              await cart_page.screenshot(
                  path="amazon-cart.png",
                  full_page=True
              )

              browser.close()
          PY

          python amazon_offer_test.py

      - name: Upload Amazon diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-offer-diagnostics
          path: |
            amazon-after-click.png
            amazon-cart.png
            amazon-offers-current.png
            amazon-error-delivery.png
            amazon-no-offer-link.png
          if-no-files-found: ignore
