name: Amazon Offer Structure Test

on:
  workflow_dispatch:

jobs:
  amazon-offer-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Analyze Amazon offers
        run: |
          cat > amazon_offer_structure.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re

          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          ZIP_CODE = "00100"

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          with sync_playwright() as p:

              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000
                  }
              )

              page = context.new_page()

              print("=" * 80)
              print("1. OPEN AMAZON")
              print("=" * 80)

              response = page.goto(
                  "https://www.amazon.it/",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print(
                  "HTTP:",
                  response.status if response else "NONE"
              )

              print("URL:", page.url)
              print("TITLE:", page.title())

              page.wait_for_timeout(3000)

              # Handle Amazon intermediate "Continua con gli acquisti"
              continue_buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              print(
                  "CONTINUE BUTTONS:",
                  continue_buttons.count()
              )

              for i in range(continue_buttons.count()):

                  try:

                      button = continue_buttons.nth(i)

                      if button.is_visible():

                          print(
                              "CLICK CONTINUE:",
                              i
                          )

                          button.click()

                          page.wait_for_timeout(5000)

                          break

                  except Exception as e:

                      print(
                          "CONTINUE ERROR:",
                          repr(e)
                      )

              print()
              print("=" * 80)
              print("2. SET ITALIAN DELIVERY ZIP")
              print("=" * 80)

              ingress = page.locator(
                  "#glow-ingress-block"
              )

              print(
                  "DELIVERY BLOCK:",
                  ingress.count()
              )

              if ingress.count() == 0:

                  print(
                      "ERROR: delivery block not found"
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "DELIVERY BEFORE:",
                  repr(
                      clean(
                          ingress.first.inner_text()
                      )
                  )
              )

              ingress.first.click()

              page.wait_for_timeout(1500)

              zip_input = page.locator(
                  "#GLUXZipUpdateInput"
              )

              print(
                  "ZIP INPUT:",
                  zip_input.count()
              )

              if zip_input.count() == 0:

                  print(
                      "ERROR: ZIP input not found"
                  )

                  browser.close()
                  raise SystemExit(1)

              zip_input.fill(ZIP_CODE)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              )

              print(
                  "ZIP CONFIRM:",
                  confirm.count()
              )

              if confirm.count() == 0:

                  print(
                      "ERROR: ZIP confirm not found"
                  )

                  browser.close()
                  raise SystemExit(1)

              confirm.first.click()

              page.wait_for_timeout(3000)

              confirmation = page.locator(
                  "#GLUXZipConfirmationValue"
              )

              if confirmation.count() > 0:

                  print(
                      "CONFIRMED ZIP:",
                      repr(
                          clean(
                              confirmation.first.inner_text()
                          )
                      )
                  )

              print()
              print("=" * 80)
              print("3. OPEN PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              print(
                  "PRODUCT URL:",
                  page.url
              )

              print(
                  "PRODUCT TITLE:",
                  page.title()
              )

              title = page.locator(
                  "#productTitle"
              )

              if title.count() > 0:

                  print(
                      "PRODUCT:",
                      clean(
                          title.first.inner_text()
                      )
                  )

              delivery = page.locator(
                  "#glow-ingress-block"
              )

              if delivery.count() > 0:

                  print(
                      "DELIVERY:",
                      repr(
                          clean(
                              delivery.first.inner_text()
                          )
                      )
                  )

              print()
              print("=" * 80)
              print("4. FIND OFFER-LISTING LINK")
              print("=" * 80)

              offer_links = page.locator(
                  "a[href*='/gp/offer-listing/B0H9HFPRRD/']"
              )

              print(
                  "OFFER LINKS:",
                  offer_links.count()
              )

              if offer_links.count() == 0:

                  print(
                      "ERROR: offer-listing link not found"
                  )

                  browser.close()
                  raise SystemExit(1)

              href = offer_links.first.get_attribute(
                  "href"
              )

              offer_url = (
                  "https://www.amazon.it" + href
                  if href.startswith("/")
                  else href
              )

              print(
                  "OFFER URL:",
                  offer_url
              )

              print()
              print("=" * 80)
              print("5. OPEN OFFER PAGE")
              print("=" * 80)

              offers = context.new_page()

              response = offers.goto(
                  offer_url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print(
                  "HTTP:",
                  response.status if response else "NONE"
              )

              print(
                  "FINAL URL:",
                  offers.url
              )

              print(
                  "TITLE:",
                  offers.title()
              )

              offers.wait_for_timeout(5000)

              body = offers.locator(
                  "body"
              ).inner_text()

              print(
                  "BODY LENGTH:",
                  len(body)
              )

              print()
              print("=" * 80)
              print("6. OFFER-RELATED ELEMENTS")
              print("=" * 80)

              # Amazon offer pages commonly use these classes/attributes.
              selectors = [
                  "[id*='aod-offer']",
                  "[id*='aod-offer-heading']",
                  "[id*='aod-offer-price']",
                  "[id*='aod-offer-soldBy']",
                  "[id*='aod-offer-shipsFrom']",
                  "[id*='aod-offer-qty']",
                  "[id*='aod-offer-add-to-cart']",
                  "[class*='aod-information-block']",
                  "[class*='aod-offer']",
                  "[data-aod-atc-action]"
              ]

              for selector in selectors:

                  try:

                      count = offers.locator(
                          selector
                      ).count()

                      print(
                          selector,
                          "=>",
                          count
                      )

                  except Exception as e:

                      print(
                          selector,
                          "=> ERROR",
                          repr(e)
                      )

              print()
              print("=" * 80)
              print("7. POSSIBLE OFFER CONTAINERS")
              print("=" * 80)

              # Try to identify the actual offer blocks.
              offer_selectors = [
                  "[id^='aod-offer']",
                  "div[id*='aod-offer']",
                  "div[class*='aod-offer']",
                  "div[data-aod-atc-action]"
              ]

              found = []

              for selector in offer_selectors:

                  try:

                      elements = offers.locator(
                          selector
                      )

                      count = elements.count()

                      print()
                      print(
                          "SELECTOR:",
                          selector,
                          "COUNT:",
                          count
                      )

                      for i in range(
                          min(count, 50)
                      ):

                          try:

                              element = elements.nth(i)

                              if not element.is_visible():
                                  continue

                              text = clean(
                                  element.inner_text()
                              )

                              if not text:
                                  continue

                              # Avoid printing the same huge parent repeatedly.
                              if len(text) > 6000:
                                  text = text[:6000] + "..."

                              print()
                              print(
                                  "--- ELEMENT",
                                  i,
                                  "---"
                              )

                              print(text)

                              # Print useful attributes.
                              for attr in [
                                  "id",
                                  "class",
                                  "data-aod-atc-action",
                                  "data-csa-c-item-id",
                                  "data-csa-c-type"
                              ]:

                                  try:

                                      value = element.get_attribute(
                                          attr
                                      )

                                      if value:

                                          print(
                                              attr + ":",
                                              repr(value)
                                          )

                                  except Exception:
                                      pass

                          except Exception:
                              pass

                  except Exception as e:

                      print(
                          "SELECTOR ERROR:",
                          repr(e)
                      )

              print()
              print("=" * 80)
              print("8. ELEMENTS WITH 'Aggiungi al carrello'")
              print("=" * 80)

              buttons = offers.get_by_text(
                  "Aggiungi al carrello",
                  exact=True
              )

              print(
                  "ADD TO CART TEXT COUNT:",
                  buttons.count()
              )

              for i in range(
                  min(buttons.count(), 30)
              ):

                  try:

                      button = buttons.nth(i)

                      print()
                      print(
                          "--- BUTTON",
                          i,
                          "---"
                      )

                      print(
                          "VISIBLE:",
                          button.is_visible()
                      )

                      print(
                          "TAG:",
                          button.evaluate(
                              "(e) => e.tagName"
                          )
                      )

                      print(
                          "TEXT:",
                          repr(
                              clean(
                                  button.inner_text()
                              )
                          )
                      )

                      print(
                          "ID:",
                          repr(
                              button.get_attribute("id")
                          )
                      )

                      print(
                          "CLASS:",
                          repr(
                              button.get_attribute("class")
                          )
                      )

                      print(
                          "NAME:",
                          repr(
                              button.get_attribute("name")
                          )
                      )

                      print(
                          "DATA ACTION:",
                          repr(
                              button.get_attribute(
                                  "data-aod-atc-action"
                              )
                          )
                      )

                      # Walk up the DOM and print parent texts.
                      parent_info = button.evaluate(
                          """
                          (e) => {
                              const result = [];
                              let node = e;

                              for (let i = 0; i < 6 && node; i++, node = node.parentElement) {
                                  result.push({
                                      tag: node.tagName,
                                      id: node.id || "",
                                      cls: node.className || "",
                                      text: (node.innerText || "").replace(/\\s+/g, " ").trim().slice(0, 2500)
                                  });
                              }

                              return result;
                          }
                          """
                      )

                      print(
                          "PARENT CHAIN:"
                      )

                      for parent in parent_info:

                          print(
                              "TAG:",
                              parent["tag"],
                              "ID:",
                              repr(parent["id"]),
                              "CLASS:",
                              repr(parent["cls"])
                          )

                          print(
                              "TEXT:",
                              parent["text"]
                          )

                          print()

                  except Exception as e:

                      print(
                          "BUTTON ERROR:",
                          repr(e)
                      )

              print()
              print("=" * 80)
              print("9. PRICE ELEMENTS")
              print("=" * 80)

              price_selectors = [
                  ".a-price",
                  ".a-offscreen",
                  "[class*='a-price']",
                  "[id*='price']",
                  "[class*='price']"
              ]

              seen = set()

              for selector in price_selectors:

                  try:

                      elements = offers.locator(
                          selector
                      )

                      count = elements.count()

                      print()
                      print(
                          "SELECTOR:",
                          selector,
                          "COUNT:",
                          count
                      )

                      for i in range(
                          min(count, 100)
                      ):

                          try:

                              element = elements.nth(i)

                              if not element.is_visible():
                                  continue

                              text = clean(
                                  element.inner_text()
                              )

                              if not text:
                                  continue

                              key = (
                                  selector,
                                  text
                              )

                              if key in seen:
                                  continue

                              seen.add(key)

                              print(
                                  "PRICE ELEMENT:",
                                  repr(
                                      text[:500]
                                  )
                              )

                          except Exception:
                              pass

                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("10. OFFER IDs / DATA ATTRIBUTES")
              print("=" * 80)

              all_elements = offers.locator(
                  "[id]"
              )

              printed = 0

              for i in range(
                  min(all_elements.count(), 10000)
              ):

                  try:

                      element = all_elements.nth(i)

                      element_id = (
                          element.get_attribute("id")
                          or ""
                      )

                      if "offer" not in element_id.lower():
                          continue

                      if not element.is_visible():
                          continue

                      text = clean(
                          element.inner_text()
                      )

                      print(
                          "ID:",
                          element_id
                      )

                      if text:

                          print(
                              "TEXT:",
                              text[:1500]
                          )

                      for attr in [
                          "data-aod-atc-action",
                          "data-csa-c-item-id",
                          "data-csa-c-type",
                          "data-csa-c-content-id"
                      ]:

                          value = element.get_attribute(
                              attr
                          )

                          if value:

                              print(
                                  attr + ":",
                                  repr(value)
                              )

                      print()

                      printed += 1

                      if printed >= 100:

                          break

                  except Exception:
                      pass

              if printed == 0:

                  print(
                      "NO OFFER IDS FOUND"
                  )

              print()
              print("=" * 80)
              print("11. COMPLETE OFFER TEXT")
              print("=" * 80)

              print(
                  body[:25000]
              )

              print()
              print("=" * 80)
              print("12. END")
              print("=" * 80)

              browser.close()
          PY

          python amazon_offer_structure.py
