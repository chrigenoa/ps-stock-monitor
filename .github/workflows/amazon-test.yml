name: Amazon Continue Shopping Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon intermediate page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON CONTINUE SHOPPING TEST")
              print("=" * 80)

              print()
              print("LOADING...")

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=45000,
              )

              print(
                  "HTTP STATUS:",
                  response.status if response else "NO RESPONSE"
              )

              print(
                  "INITIAL URL:",
                  page.url
              )

              page.wait_for_timeout(3000)

              print()
              print("=" * 80)
              print("INITIAL PAGE")
              print("=" * 80)

              print(
                  "TITLE:",
                  repr(page.title())
              )

              print(
                  "URL:",
                  page.url
              )

              print()
              print("BODY:")

              body = page.locator("body").inner_text(
                  timeout=10000
              )

              print(body[:3000])

              print()
              print("=" * 80)
              print("CONTINUE BUTTONS")
              print("=" * 80)

              buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              print(
                  "COUNT:",
                  buttons.count()
              )

              for i in range(buttons.count()):

                  element = buttons.nth(i)

                  try:
                      print(
                          i,
                          "visible=",
                          element.is_visible(),
                          "tag=",
                          element.evaluate(
                              "(el) => el.tagName"
                          ),
                          "href=",
                          element.get_attribute("href")
                      )
                  except Exception as e:
                      print(
                          i,
                          "ERROR:",
                          repr(e)
                      )

              if buttons.count() > 0:

                  target = None

                  for i in range(buttons.count()):

                      element = buttons.nth(i)

                      try:
                          if element.is_visible():
                              target = element
                              break
                      except Exception:
                          pass

                  if target:

                      print()
                      print(
                          "CLICKING CONTINUE..."
                      )

                      target.click()

                      page.wait_for_timeout(5000)

                      print()
                      print("=" * 80)
                      print("AFTER CONTINUE")
                      print("=" * 80)

                      print(
                          "TITLE:",
                          repr(page.title())
                      )

                      print(
                          "URL:",
                          page.url
                      )

                      print()
                      print("BODY LENGTH:")

                      body_after = page.locator(
                          "body"
                      ).inner_text(
                          timeout=10000
                      )

                      print(
                          len(body_after)
                      )

                      print()
                      print("BODY FIRST 5000 CHARACTERS:")

                      print(
                          body_after[:5000]
                      )

                      print()
                      print("=" * 80)
                      print("IMPORTANT SELECTORS AFTER CONTINUE")
                      print("=" * 80)

                      selectors = [
                          "#glow-ingress-block",
                          "#productTitle",
                          "#buybox",
                          "#add-to-cart-button",
                          "#buy-now-button",
                          "#captchacharacters",
                          "#sp-cc-accept",
                          "#nav-logo-sprites",
                      ]

                      for selector in selectors:

                          locator = page.locator(
                              selector
                          )

                          count = locator.count()

                          visible = False

                          if count > 0:

                              try:
                                  visible = (
                                      locator.first.is_visible()
                                  )
                              except Exception:
                                  pass

                          print(
                              selector,
                              "count=",
                              count,
                              "visible=",
                              visible
                          )

                          if count > 0 and visible:

                              try:
                                  text = locator.first.inner_text(
                                      timeout=3000
                                  ).strip()

                                  print(
                                      "  TEXT:",
                                      repr(text[:1000])
                                  )

                              except Exception:
                                  pass

                      print()
                      print("=" * 80)
                      print("COOKIES")
                      print("=" * 80)

                      for cookie in context.cookies():

                          print(
                              cookie["name"],
                              "=",
                              cookie["value"][:300]
                          )

                  else:

                      print(
                          "NO VISIBLE CONTINUE BUTTON"
                      )

              else:

                  print(
                      "CONTINUE BUTTON NOT FOUND"
                  )

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()

          PY
