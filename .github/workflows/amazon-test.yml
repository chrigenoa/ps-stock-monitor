name: Amazon Delivery Debug 2

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Debug Amazon delivery change
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON DELIVERY DEBUG 2")
              print("=" * 80)

              # ---------------------------------------------------------
              # 1. OPEN PRODUCT
              # ---------------------------------------------------------

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(5000)

              print()
              print("URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(page.title())

              # ---------------------------------------------------------
              # 2. COOKIES BEFORE
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("COOKIES BEFORE")
              print("=" * 80)

              cookies_before = context.cookies()

              for cookie in cookies_before:
                  print(
                      cookie["name"],
                      "=",
                      cookie["value"],
                      "| domain=",
                      cookie["domain"],
                  )

              # ---------------------------------------------------------
              # 3. DELIVERY ELEMENT
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("DELIVERY ELEMENT")
              print("=" * 80)

              selectors = [
                  "#glow-ingress-block",
                  "#glow-ingress-line1",
                  "#glow-ingress-line2",
                  "#nav-global-location-popover-link",
              ]

              delivery_element = None

              for selector in selectors:

                  locator = page.locator(selector)

                  if locator.count() == 0:
                      continue

                  for i in range(locator.count()):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      if not visible:
                          continue

                      try:
                          text = element.inner_text().strip()
                      except Exception:
                          text = ""

                      print(
                          selector,
                          "| visible=",
                          visible,
                          "| text=",
                          repr(text),
                      )

                      if delivery_element is None:
                          delivery_element = element

              if delivery_element is None:
                  print()
                  print("ERROR: DELIVERY ELEMENT NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print()
              print("CLICKING DELIVERY ELEMENT...")

              delivery_element.click()

              page.wait_for_timeout(1500)

              # ---------------------------------------------------------
              # 4. POPUP BEFORE CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("POPUP BEFORE CAP")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              for line in body_text.splitlines():

                  line = line.strip()

                  if (
                      "indirizzo di consegna" in line.lower()
                      or "stati uniti" in line.lower()
                      or "cap italiano" in line.lower()
                      or "fatto" == line.lower()
                  ):
                      print(line)

              # ---------------------------------------------------------
              # 5. CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("CAP INPUT")
              print("=" * 80)

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print("COUNT:", cap_input.count())

              if cap_input.count() == 0:
                  print("ERROR: CAP INPUT NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print("VISIBLE:", cap_input.is_visible())

              print(
                  "ARIA:",
                  cap_input.get_attribute("aria-label"),
              )

              print()
              print("FILLING CAP:", CAP)

              cap_input.fill(CAP)

              print(
                  "INPUT VALUE:",
                  cap_input.input_value(),
              )

              page.wait_for_timeout(500)

              # ---------------------------------------------------------
              # 6. BUTTON
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("FATTO BUTTON")
              print("=" * 80)

              done_button = page.locator(
                  "button[name='glowDoneButton']"
              ).first

              print("COUNT:", done_button.count())

              if done_button.count() == 0:
                  print("ERROR: FATTO BUTTON NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  done_button.is_visible(),
              )

              print(
                  "TEXT:",
                  repr(done_button.inner_text()),
              )

              print(
                  "DISABLED:",
                  done_button.is_disabled(),
              )

              # ---------------------------------------------------------
              # 7. COOKIES IMMEDIATELY BEFORE CLICK
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("COOKIES IMMEDIATELY BEFORE FATTO")
              print("=" * 80)

              cookies_before_click = context.cookies()

              for cookie in cookies_before_click:
                  print(
                      cookie["name"],
                      "=",
                      cookie["value"],
                      "| domain=",
                      cookie["domain"],
                  )

              # ---------------------------------------------------------
              # 8. CLICK FATTO
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("CLICKING FATTO")
              print("=" * 80)

              old_url = page.url

              done_button.click()

              print()
              print("CLICK SENT")

              page.wait_for_timeout(1000)

              print()
              print("URL AFTER 1 SECOND:")
              print(page.url)

              print()
              print("WAITING 5 MORE SECONDS...")

              page.wait_for_timeout(5000)

              print()
              print("FINAL URL:")
              print(page.url)

              print()
              print("URL CHANGED:")
              print(page.url != old_url)

              # ---------------------------------------------------------
              # 9. COOKIES AFTER
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("COOKIES AFTER")
              print("=" * 80)

              cookies_after = context.cookies()

              for cookie in cookies_after:
                  print(
                      cookie["name"],
                      "=",
                      cookie["value"],
                      "| domain=",
                      cookie["domain"],
                  )

              # ---------------------------------------------------------
              # 10. DELIVERY ELEMENT AFTER
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("DELIVERY AFTER")
              print("=" * 80)

              final_selectors = [
                  "#glow-ingress-block",
                  "#glow-ingress-line1",
                  "#glow-ingress-line2",
                  "#nav-global-location-popover-link",
              ]

              for selector in final_selectors:

                  locator = page.locator(selector)

                  if locator.count() == 0:
                      continue

                  for i in range(locator.count()):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      if not visible:
                          continue

                      try:
                          text = element.inner_text().strip()
                      except Exception:
                          text = ""

                      print()
                      print(
                          selector,
                          "| visible=",
                          visible,
                      )
                      print(text)

              # ---------------------------------------------------------
              # 11. SEARCH DELIVERY TEXT
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("DELIVERY TEXT AFTER")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              for line in body_text.splitlines():

                  line = line.strip()

                  if (
                      "indirizzo di consegna" in line.lower()
                      or "stati uniti" in line.lower()
                      or "00100" in line
                      or "roma" in line.lower()
                      or "italia" == line.lower()
                  ):
                      print(line)

              # ---------------------------------------------------------
              # 12. PRODUCT
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("PRODUCT")
              print("=" * 80)

              title = page.locator(
                  "#productTitle"
              ).first

              if title.count() > 0:
                  print()
                  print(
                      title.inner_text().strip()
                  )

              print()
              print(
                  "ADD TO CART:",
                  page.locator(
                      "#add-to-cart-button"
                  ).count(),
              )

              print(
                  "BUY NOW:",
                  page.locator(
                      "#buy-now-button"
                  ).count(),
              )

              print()
              print("=" * 80)
              print("END DEBUG 2")
              print("=" * 80)

              browser.close()
          PY
