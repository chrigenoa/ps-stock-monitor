name: Amazon Postal Code Test 3

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect Amazon location state
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON POSTAL CODE TEST 3")
              print("=" * 80)

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(3000)

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              print()
              print("=" * 80)
              print("INITIAL DELIVERY")
              print("=" * 80)

              print(
                  delivery.inner_text().strip()
              )

              print()
              print("CLICKING DELIVERY...")

              delivery.click()

              page.wait_for_timeout(1500)

              cap = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              cap.fill(CAP)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              ).first

              print()
              print("=" * 80)
              print("BEFORE CAP CONFIRM")
              print("=" * 80)

              print(
                  "CAP:",
                  cap.input_value()
              )

              print()
              print("RELEVANT INPUTS:")

              inputs = page.locator(
                  "input"
              )

              for i in range(
                  inputs.count()
              ):

                  element = inputs.nth(i)

                  try:
                      visible = element.is_visible()
                  except Exception:
                      visible = False

                  element_id = element.get_attribute("id")
                  name = element.get_attribute("name")
                  value = element.get_attribute("value")

                  if (
                      visible
                      or (
                          element_id
                          and "GLUX" in element_id
                      )
                      or (
                          name
                          and (
                              "location" in name.lower()
                              or "zip" in name.lower()
                              or "postal" in name.lower()
                          )
                      )
                  ):

                      print(
                          i,
                          "id=",
                          element_id,
                          "name=",
                          name,
                          "value=",
                          repr(value)
                      )

              print()
              print("CLICKING CAP CONFIRM...")

              confirm.click()

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("AFTER CAP CONFIRM")
              print("=" * 80)

              print()
              print("CONFIRMED ZIP:")

              confirmed = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              print(
                  repr(
                      confirmed.inner_text().strip()
                  )
              )

              print()
              print("COOKIES AFTER CAP CONFIRM:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:200]
                  )

              print()
              print("=" * 80)
              print("GLUX LOCATION ELEMENTS")
              print("=" * 80)

              glux = page.locator(
                  "[id^='GLUX']"
              )

              print(
                  "COUNT:",
                  glux.count()
              )

              for i in range(
                  glux.count()
              ):

                  element = glux.nth(i)

                  element_id = element.get_attribute(
                      "id"
                  )

                  tag = element.evaluate(
                      "(el) => el.tagName"
                  )

                  try:
                      text = element.inner_text().strip()
                  except Exception:
                      text = ""

                  if text:
                      text = text[:300]

                  print(
                      i,
                      tag,
                      element_id,
                      repr(text)
                  )

              print()
              print("=" * 80)
              print("HIDDEN SUCCESS DIALOG")
              print("=" * 80)

              success = page.locator(
                  "#GLUXHiddenSuccessDialog"
              ).first

              print(
                  "VISIBLE:",
                  success.is_visible()
              )

              print(
                  success.inner_text().strip()
              )

              print()
              print("=" * 80)
              print("CLOSING SUCCESS DIALOG")
              print("=" * 80)

              close = page.locator(
                  "#GLUXConfirmClose"
              ).first

              print(
                  "COUNT:",
                  close.count()
              )

              print(
                  "VISIBLE:",
                  close.is_visible()
              )

              if close.count() > 0 and close.is_visible():

                  close.click()

                  page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("AFTER CLOSING")
              print("=" * 80)

              print()
              print("DELIVERY:")

              print(
                  page.locator(
                      "#glow-ingress-block"
                  ).first.inner_text().strip()
              )

              print()
              print("COOKIES:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:200]
                  )

              print()
              print("FINAL BUYBOX:")

              buybox = page.locator(
                  "#buybox"
              ).first

              print(
                  buybox.inner_text().strip()[:3000]
              )

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()

          PY
