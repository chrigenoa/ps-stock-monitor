name: Amazon Offers Test

on:
  workflow_dispatch:

jobs:
  amazon-offers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Analyze Amazon offers
        run: |
          cat > amazon_offers_test.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re

          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          ZIP_CODE = "00100"

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={"width": 1440, "height": 1000},
              )

              page = context.new_page()

              print("=" * 80)
              print("1. OPEN AMAZON")
              print("=" * 80)

              response = page.goto(
                  "https://www.amazon.it/",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print("HTTP:", response.status if response else "NONE")
              print("URL:", page.url)
              print("TITLE:", page.title())

              page.wait_for_timeout(3000)

              # Amazon sometimes shows the intermediate "Continua con gli acquisti"
              # page before exposing the normal site.
              continue_buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              if continue_buttons.count() > 0:
                  clicked = False

                  for i in range(continue_buttons.count()):
                      try:
                          button = continue_buttons.nth(i)

                          if button.is_visible():
                              print("CLICK: Continua con gli acquisti")
                              button.click()
                              page.wait_for_timeout(5000)
                              clicked = True
                              break

                      except Exception:
                          pass

                  print("CONTINUE CLICKED:", clicked)

              print()
              print("=" * 80)
              print("2. SET DELIVERY ZIP")
              print("=" * 80)

              ingress = page.locator("#glow-ingress-block")

              if ingress.count() == 0:
                  print("ERROR: #glow-ingress-block NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print("DELIVERY BEFORE:", repr(clean(ingress.inner_text())))

              ingress.click()
              page.wait_for_timeout(1500)

              zip_input = page.locator("#GLUXZipUpdateInput")

              if zip_input.count() == 0:
                  print("ERROR: ZIP INPUT NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print("ZIP INPUT FOUND")

              zip_input.fill(ZIP_CODE)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              )

              print("ZIP CONFIRM COUNT:", confirm.count())

              if confirm.count() == 0:
                  print("ERROR: ZIP CONFIRM NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              confirm.first.click()
              page.wait_for_timeout(3000)

              confirmation = page.locator(
                  "#GLUXZipConfirmationValue"
              )

              if confirmation.count() > 0:
                  print(
                      "CONFIRMED ZIP:",
                      repr(clean(confirmation.first.inner_text()))
                  )

              print("COOKIES AFTER ZIP:")
              for cookie in context.cookies():
                  print(
                      " ",
                      cookie["name"],
                      "=",
                      cookie["value"][:120]
                  )

              print()
              print("=" * 80)
              print("3. OPEN PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print("PRODUCT URL:", page.url)
              print("TITLE:", page.title())

              product_title = page.locator("#productTitle").first

              print(
                  "PRODUCT TITLE COUNT:",
                  page.locator("#productTitle").count()
              )

              if product_title.count() > 0:
                  print(
                      "PRODUCT:",
                      clean(product_title.inner_text())
                  )

              delivery = page.locator("#glow-ingress-block").first

              if delivery.count() > 0:
                  print(
                      "DELIVERY:",
                      repr(clean(delivery.inner_text()))
                  )

              print()
              print("=" * 80)
              print("4. FIND OFFER-LISTING LINK")
              print("=" * 80)

              offer_link = page.locator(
                  "a[href*='/gp/offer-listing/B0H9HFPRRD/']"
              ).first

              print("OFFER LINK COUNT:", offer_link.count())

              if offer_link.count() == 0:
                  print("ERROR: OFFER-LISTING LINK NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              href = offer_link.get_attribute("href")

              print("OFFER HREF:", href)

              offer_url = page.url.split("/dp/")[0] + href

              print("OFFER URL:", offer_url)

              print()
              print("=" * 80)
              print("5. OPEN OFFER LISTING")
              print("=" * 80)

              offer_page = context.new_page()

              offer_response = offer_page.goto(
                  offer_url,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print(
                  "HTTP:",
                  offer_response.status if offer_response else "NONE"
              )
              print("URL:", offer_page.url)
              print("TITLE:", offer_page.title())

              offer_page.wait_for_timeout(5000)

              body_text = offer_page.locator("body").inner_text()

              print()
              print("=" * 80)
              print("6. OFFER PAGE BASIC TEXT")
              print("=" * 80)

              print(body_text[:12000])

              print()
              print("=" * 80)
              print("7. OFFER-RELATED ELEMENTS")
              print("=" * 80)

              selectors = [
                  "[id*='offer']",
                  "[class*='offer']",
                  "[id*='buybox']",
                  "[class*='buybox']",
                  "[id*='price']",
                  "[class*='price']",
                  "input[type='submit']",
                  "button",
                  "a",
              ]

              seen = set()
              element_number = 0

              for selector in selectors:
                  try:
                      elements = offer_page.locator(selector)

                      for i in range(min(elements.count(), 200)):
                          element = elements.nth(i)

                          try:
                              text = clean(element.inner_text())
                              aria = clean(
                                  element.get_attribute("aria-label")
                              )
                              href = element.get_attribute("href")
                              element_id = element.get_attribute("id")
                              classes = element.get_attribute("class")

                              combined = " | ".join(
                                  x for x in [
                                      text,
                                      aria,
                                      href,
                                      element_id,
                                      classes,
                                  ]
                                  if x
                              )

                              if not combined:
                                  continue

                              key = combined[:1000]

                              if key in seen:
                                  continue

                              seen.add(key)

                              interesting = any(
                                  word.lower() in combined.lower()
                                  for word in [
                                      "disponibile",
                                      "esaurito",
                                      "non disponibile",
                                      "acquista",
                                      "carrello",
                                      "venduto",
                                      "spedito",
                                      "amazon",
                                      "€",
                                      "EUR",
                                      "prezzo",
                                      "offerta",
                                      "invito",
                                      "consegna",
                                      "00100",
                                  ]
                              )

                              if not interesting:
                                  continue

                              element_number += 1

                              print()
                              print("ELEMENT", element_number)
                              print("SELECTOR:", selector)
                              print("TAG:", element.evaluate(
                                  "(el) => el.tagName"
                              ))
                              print("TEXT:", repr(text[:1500]))
                              print("ARIA:", repr(aria[:500]))
                              print("HREF:", repr(href))
                              print("ID:", repr(element_id))
                              print("CLASS:", repr(classes[:500] if classes else None))

                          except Exception:
                              pass

                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("8. PURCHASE / AVAILABILITY KEYWORDS")
              print("=" * 80)

              keywords = [
                  "Disponibile",
                  "Non disponibile",
                  "Esaurito",
                  "Disponibile su invito",
                  "Richiedi invito",
                  "Aggiungi al carrello",
                  "Acquista ora",
                  "Venduto da",
                  "Spedito da",
                  "Amazon",
                  "Prezzo",
                  "€",
                  "EUR",
                  "Consegna",
                  "00100",
              ]

              lines = body_text.splitlines()

              for keyword in keywords:
                  print()
                  print("KEYWORD:", repr(keyword))

                  found = False

                  for line in lines:
                      line_clean = clean(line)

                      if keyword.lower() in line_clean.lower():
                          print(" ", repr(line_clean[:1000]))
                          found = True

                  if not found:
                      print("  NOT FOUND")

              print()
              print("=" * 80)
              print("9. OFFER CONTAINERS SUMMARY")
              print("=" * 80)

              container_selectors = [
                  "[id*='offer']",
                  "[class*='offer']",
                  "[id*='aod']",
                  "[class*='aod']",
              ]

              total = 0

              for selector in container_selectors:
                  try:
                      loc = offer_page.locator(selector)
                      count = loc.count()

                      print()
                      print("SELECTOR:", selector)
                      print("COUNT:", count)

                      for i in range(min(count, 50)):
                          try:
                              txt = clean(loc.nth(i).inner_text())

                              if txt:
                                  total += 1
                                  print()
                                  print("CONTAINER", total)
                                  print(txt[:3000])
                          except Exception:
                              pass

                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("10. FINAL")
              print("=" * 80)
              print("Offer-listing analysis completed.")

              browser.close()
          PY

          python amazon_offers_test.py
