name: Amazon Page Diagnostic

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnose Amazon page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON PAGE DIAGNOSTIC")
              print("=" * 80)

              print()
              print("OPENING:")
              print(URL)

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=30000,
                  )

                  print()
                  print("=" * 80)
                  print("RESPONSE")
                  print("=" * 80)

                  if response:
                      print("STATUS:", response.status)
                      print("RESPONSE URL:", response.url)
                  else:
                      print("NO RESPONSE OBJECT")

              except Exception as e:
                  print()
                  print("GOTO ERROR:")
                  print(repr(e))

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("FINAL PAGE")
              print("=" * 80)

              print("URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(page.title())

              print()
              print("H1 COUNT:")
              print(page.locator("h1").count())

              print()
              print("PRODUCT TITLE COUNT:")
              print(page.locator("#productTitle").count())

              print()
              print("CAP DELIVERY ELEMENT:")
              print(
                  page.locator("#glow-ingress-block").count()
              )

              print()
              print("ADD TO CART:")
              print(
                  page.locator("#add-to-cart-button").count()
              )

              print()
              print("BUY NOW:")
              print(
                  page.locator("#buy-now-button").count()
              )

              print()
              print("=" * 80)
              print("IMPORTANT PAGE TEXT")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              lines = body_text.splitlines()

              keywords = [
                  "captcha",
                  "robot",
                  "automated",
                  "access",
                  "temporarily",
                  "sign in",
                  "accedi",
                  "stati uniti",
                  "italia",
                  "indirizzo",
                  "consegna",
                  "disponibile",
                  "pokemon",
                  "B0H9HFPRRD",
              ]

              found = set()

              for line in lines:

                  line = line.strip()

                  if not line:
                      continue

                  lower = line.lower()

                  if any(
                      keyword in lower
                      for keyword in keywords
                  ):
                      if line not in found:
                          print(line)
                          found.add(line)

              print()
              print("=" * 80)
              print("FIRST 80 BODY LINES")
              print("=" * 80)

              for line in lines[:80]:
                  line = line.strip()

                  if line:
                      print(line)

              print()
              print("=" * 80)
              print("COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"],
                      "| domain=",
                      cookie["domain"],
                  )

              print()
              print("=" * 80)
              print("END")
              print("=" * 80)

              browser.close()
          PY
