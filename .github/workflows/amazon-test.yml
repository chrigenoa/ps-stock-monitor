name: Amazon Location From Home Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon location from home
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          AMAZON_HOME = "https://www.amazon.it/"
          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON LOCATION FROM HOME TEST")
              print("=" * 80)

              print()
              print("LOADING AMAZON HOME...")

              response = page.goto(
                  AMAZON_HOME,
                  wait_until="domcontentloaded",
                  timeout=45000,
              )

              print(
                  "HTTP STATUS:",
                  response.status if response else "NO RESPONSE"
              )

              print(
                  "URL:",
                  page.url
              )

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("INITIAL PAGE")
              print("=" * 80)

              print(
                  "TITLE:",
                  repr(page.title())
              )

              body = page.locator("body").inner_text(
                  timeout=10000
              )

              print(
                  "BODY LENGTH:",
                  len(body)
              )

              print(
                  "BODY FIRST 1500:"
              )

              print(body[:1500])

              print()
              print("=" * 80)
              print("CONTINUE SHOPPING")
              print("=" * 80)

              continue_buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              print(
                  "COUNT:",
                  continue_buttons.count()
              )

              target = None

              for i in range(
                  continue_buttons.count()
              ):

                  element = continue_buttons.nth(i)

                  try:
                      if element.is_visible():
                          target = element
                          break
                  except Exception:
                      pass

              if target:

                  print(
                      "CLICKING CONTINUE..."
                  )

                  target.click()

                  page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("AMAZON HOME AFTER CONTINUE")
              print("=" * 80)

              print(
                  "TITLE:",
                  repr(page.title())
              )

              print(
                  "URL:",
                  page.url
              )

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              print()
              print(
                  "DELIVERY COUNT:",
                  delivery.count()
              )

              if delivery.count() > 0:

                  print(
                      "DELIVERY VISIBLE:",
                      delivery.is_visible()
                  )

                  if delivery.is_visible():

                      print(
                          "DELIVERY:",
                          delivery.inner_text().strip()
                      )

              if delivery.count() == 0:

                  print(
                      "DELIVERY ELEMENT NOT FOUND."
                  )

                  browser.close()
                  raise SystemExit(1)

              print()
              print("=" * 80)
              print("OPENING DELIVERY")
              print("=" * 80)

              delivery.click()

              page.wait_for_timeout(2000)

              cap = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "CAP COUNT:",
                  cap.count()
              )

              if cap.count() == 0:

                  print(
                      "CAP INPUT NOT FOUND."
                  )

                  print(
                      "BODY:",
                      page.locator("body").inner_text()[:5000]
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "CAP VISIBLE:",
                  cap.is_visible()
              )

              cap.fill(CAP)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              ).first

              print(
                  "CONFIRM COUNT:",
                  confirm.count()
              )

              print(
                  "CONFIRM VISIBLE:",
                  confirm.is_visible()
              )

              print(
                  "CONFIRM DISABLED:",
                  confirm.is_disabled()
              )

              print()
              print("=" * 80)
              print("BEFORE CAP CONFIRM")
              print("=" * 80)

              print(
                  "CAP:",
                  cap.input_value()
              )

              print()
              print("CLICKING CAP CONFIRM...")

              confirm.click()

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("AFTER CAP CONFIRM")
              print("=" * 80)

              confirmed = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              print(
                  "CONFIRMED ZIP COUNT:",
                  confirmed.count()
              )

              if confirmed.count() > 0:

                  try:
                      print(
                          "CONFIRMED ZIP:",
                          repr(
                              confirmed.inner_text().strip()
                          )
                      )
                  except Exception:
                      pass

              success = page.locator(
                  "#GLUXHiddenSuccessDialog"
              ).first

              print()
              print(
                  "SUCCESS DIALOG COUNT:",
                  success.count()
              )

              if success.count() > 0:

                  print(
                      "SUCCESS VISIBLE:",
                      success.is_visible()
                  )

                  try:
                      print(
                          "SUCCESS TEXT:",
                          success.inner_text().strip()[:1500]
                      )
                  except Exception:
                      pass

              close = page.locator(
                  "#GLUXConfirmClose"
              ).first

              print()
              print(
                  "CLOSE COUNT:",
                  close.count()
              )

              if close.count() > 0:

                  print(
                      "CLOSE VISIBLE:",
                      close.is_visible()
                  )

              if close.count() > 0 and close.is_visible():

                  print(
                      "CLICKING CLOSE..."
                  )

                  close.click()

                  page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("HOME AFTER LOCATION CHANGE")
              print("=" * 80)

              delivery_final = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "DELIVERY COUNT:",
                  delivery_final.count()
              )

              if delivery_final.count() > 0:

                  print(
                      "DELIVERY:",
                      delivery_final.inner_text().strip()
                  )

              print()
              print("COOKIES:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:300]
                  )

              print()
              print("=" * 80)
              print("NOW OPENING PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=45000
              )

              page.wait_for_timeout(5000)

              print(
                  "PRODUCT URL:",
                  page.url
              )

              print(
                  "PRODUCT TITLE:",
                  repr(page.title())
              )

              print()
              print("PRODUCT SELECTORS:")

              selectors = [
                  "#productTitle",
                  "#buybox",
                  "#glow-ingress-block",
                  "#add-to-cart-button",
                  "#buy-now-button",
              ]

              for selector in selectors:

                  locator = page.locator(
                      selector
                  )

                  count = locator.count()

                  visible = False

                  if count > 0:

                      try:
                          visible = locator.first.is_visible()
                      except Exception:
                          pass

                  print(
                      selector,
                      "count=",
                      count,
                      "visible=",
                      visible
                  )

                  if count > 0 and visible:

                      try:
                          print(
                              "  TEXT:",
                              repr(
                                  locator.first.inner_text(
                                      timeout=3000
                                  ).strip()[:2000]
                              )
                          )
                      except Exception:
                          pass

              print()
              print("=" * 80)
              print("FINAL DELIVERY")
              print("=" * 80)

              delivery_product = page.locator(
                  "#glow-ingress-block"
              ).first

              if delivery_product.count() > 0:

                  try:
                      print(
                          delivery_product.inner_text().strip()
                      )
                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("FINAL BUYBOX")
              print("=" * 80)

              buybox = page.locator(
                  "#buybox"
              ).first

              if buybox.count() > 0:

                  try:
                      print(
                          buybox.inner_text().strip()[:3000]
                      )
                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()

          PY
