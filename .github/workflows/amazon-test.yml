name: Amazon Delivery DOM Debug

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect Amazon delivery popup
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON DELIVERY DOM DEBUG")
              print("=" * 80)

              # ---------------------------------------------------------
              # 1. OPEN PRODUCT
              # ---------------------------------------------------------

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(5000)

              print()
              print("URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(page.title())

              # ---------------------------------------------------------
              # 2. FIND DELIVERY ELEMENT
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("DELIVERY ELEMENT")
              print("=" * 80)

              selectors = [
                  "#glow-ingress-block",
                  "#glow-ingress-line1",
                  "#glow-ingress-line2",
                  "#nav-global-location-popover-link",
              ]

              delivery_element = None

              for selector in selectors:

                  locator = page.locator(selector)

                  print()
                  print(
                      f"SELECTOR {selector}: "
                      f"{locator.count()}"
                  )

                  for i in range(locator.count()):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      try:
                          text = element.inner_text().strip()
                      except Exception:
                          text = ""

                      print(
                          f"  #{i} "
                          f"visible={visible} "
                          f"text={text!r}"
                      )

                      if (
                          delivery_element is None
                          and visible
                      ):
                          delivery_element = element

              if delivery_element is None:

                  print()
                  print(
                      "ERROR: DELIVERY ELEMENT NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              # ---------------------------------------------------------
              # 3. OPEN POPUP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("OPENING DELIVERY POPUP")
              print("=" * 80)

              delivery_element.click()

              page.wait_for_timeout(1500)

              print()
              print("POPUP OPENED")

              # ---------------------------------------------------------
              # 4. FIND CAP INPUT
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("CAP INPUT DETAILS")
              print("=" * 80)

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print()
              print(
                  "COUNT:",
                  cap_input.count()
              )

              if cap_input.count() == 0:

                  print(
                      "ERROR: CAP INPUT NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  cap_input.is_visible()
              )

              print(
                  "TAG:",
                  cap_input.evaluate(
                      "(el) => el.tagName"
                  )
              )

              attributes = [
                  "id",
                  "name",
                  "type",
                  "value",
                  "placeholder",
                  "aria-label",
                  "autocomplete",
                  "form",
                  "class",
                  "data-action",
                  "data-name",
                  "data-testid",
              ]

              for attribute in attributes:

                  try:
                      value = cap_input.get_attribute(
                          attribute
                      )
                  except Exception:
                      value = None

                  print(
                      f"{attribute}: {value!r}"
                  )

              # ---------------------------------------------------------
              # 5. PARENT ELEMENTS OF CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("CAP PARENT CHAIN")
              print("=" * 80)

              parent_info = page.evaluate(
                  """
                  () => {
                      const input =
                          document.querySelector(
                              "#GLUXZipUpdateInput"
                          );

                      if (!input) {
                          return [];
                      }

                      const result = [];

                      let el = input;

                      for (let i = 0; i < 6 && el; i++) {

                          const attrs = {};

                          for (const attr of el.attributes) {
                              attrs[attr.name] = attr.value;
                          }

                          result.push({
                              level: i,
                              tag: el.tagName,
                              id: el.id || "",
                              className:
                                  typeof el.className === "string"
                                      ? el.className
                                      : "",
                              attributes: attrs,
                              text:
                                  (el.innerText || "")
                                  .trim()
                                  .slice(0, 500)
                          });

                          el = el.parentElement;
                      }

                      return result;
                  }
                  """
              )

              for item in parent_info:

                  print()
                  print(
                      "LEVEL:",
                      item["level"]
                  )

                  print(
                      "TAG:",
                      item["tag"]
                  )

                  print(
                      "ID:",
                      item["id"]
                  )

                  print(
                      "CLASS:",
                      item["className"]
                  )

                  print(
                      "TEXT:",
                      repr(item["text"])
                  )

                  print(
                      "ATTRIBUTES:"
                  )

                  for key, value in item[
                      "attributes"
                  ].items():

                      print(
                          f"  {key}={value!r}"
                      )

              # ---------------------------------------------------------
              # 6. FORMS CONTAINING CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("FORMS")
              print("=" * 80)

              forms = page.locator("form")

              print()
              print(
                  "TOTAL FORMS:",
                  forms.count()
              )

              for i in range(forms.count()):

                  form = forms.nth(i)

                  try:
                      text = form.inner_text().strip()
                  except Exception:
                      text = ""

                  if (
                      "GLUXZipUpdateInput"
                      in (
                          form.evaluate(
                              """
                              (el) =>
                                  el.outerHTML
                          """
                          )
                      )
                  ):

                      print()
                      print(
                          f"FORM #{i}"
                      )

                      print(
                          "ACTION:",
                          form.get_attribute(
                              "action"
                          )
                      )

                      print(
                          "METHOD:",
                          form.get_attribute(
                              "method"
                          )
                      )

                      print(
                          "ID:",
                          form.get_attribute(
                              "id"
                          )
                      )

                      print(
                          "NAME:",
                          form.get_attribute(
                              "name"
                          )
                      )

                      print(
                          "CLASS:",
                          form.get_attribute(
                              "class"
                          )
                      )

                      print()
                      print(
                          "FORM TEXT:"
                      )

                      print(text[:2000])

                      print()
                      print(
                          "FORM HTML:"
                      )

                      html = form.evaluate(
                          "(el) => el.outerHTML"
                      )

                      print(html[:12000])

              # ---------------------------------------------------------
              # 7. ALL BUTTONS NEAR CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("BUTTONS NEAR CAP")
              print("=" * 80)

              buttons_near_cap = page.evaluate(
                  """
                  () => {

                      const input =
                          document.querySelector(
                              "#GLUXZipUpdateInput"
                          );

                      if (!input) {
                          return [];
                      }

                      const container =
                          input.parentElement
                              ?.parentElement
                              ?.parentElement;

                      if (!container) {
                          return [];
                      }

                      return Array.from(
                          container.querySelectorAll(
                              "button, input[type=button], input[type=submit]"
                          )
                      ).map((el) => {

                          const attrs = {};

                          for (const attr of el.attributes) {
                              attrs[attr.name] =
                                  attr.value;
                          }

                          return {
                              tag: el.tagName,
                              text:
                                  (el.innerText || "")
                                  .trim(),
                              value:
                                  el.value || "",
                              id:
                                  el.id || "",
                              name:
                                  el.getAttribute(
                                      "name"
                                  ) || "",
                              type:
                                  el.getAttribute(
                                      "type"
                                  ) || "",
                              disabled:
                                  !!el.disabled,
                              attributes: attrs
                          };
                      });
                  }
                  """
              )

              print()

              for i, button in enumerate(
                  buttons_near_cap
              ):

                  print(
                      f"BUTTON #{i}"
                  )

                  print(
                      "TAG:",
                      button["tag"]
                  )

                  print(
                      "TEXT:",
                      repr(button["text"])
                  )

                  print(
                      "VALUE:",
                      repr(button["value"])
                  )

                  print(
                      "ID:",
                      repr(button["id"])
                  )

                  print(
                      "NAME:",
                      repr(button["name"])
                  )

                  print(
                      "TYPE:",
                      repr(button["type"])
                  )

                  print(
                      "DISABLED:",
                      button["disabled"]
                  )

                  print(
                      "ATTRIBUTES:"
                  )

                  for key, value in button[
                      "attributes"
                  ].items():

                      print(
                          f"  {key}={value!r}"
                      )

                  print()

              # ---------------------------------------------------------
              # 8. INPUTS NEAR CAP
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("INPUTS NEAR CAP")
              print("=" * 80)

              inputs_near_cap = page.evaluate(
                  """
                  () => {

                      const input =
                          document.querySelector(
                              "#GLUXZipUpdateInput"
                          );

                      if (!input) {
                          return [];
                      }

                      const container =
                          input.parentElement
                              ?.parentElement
                              ?.parentElement;

                      if (!container) {
                          return [];
                      }

                      return Array.from(
                          container.querySelectorAll(
                              "input, select"
                          )
                      ).map((el) => {

                          const attrs = {};

                          for (const attr of el.attributes) {
                              attrs[attr.name] =
                                  attr.value;
                          }

                          return {
                              tag: el.tagName,
                              id:
                                  el.id || "",
                              name:
                                  el.getAttribute(
                                      "name"
                                  ) || "",
                              type:
                                  el.getAttribute(
                                      "type"
                                  ) || "",
                              value:
                                  el.value || "",
                              attributes: attrs
                          };
                      });
                  }
                  """
              )

              for i, item in enumerate(
                  inputs_near_cap
              ):

                  print()
                  print(
                      f"INPUT/SELECT #{i}"
                  )

                  print(
                      "TAG:",
                      item["tag"]
                  )

                  print(
                      "ID:",
                      repr(item["id"])
                  )

                  print(
                      "NAME:",
                      repr(item["name"])
                  )

                  print(
                      "TYPE:",
                      repr(item["type"])
                  )

                  print(
                      "VALUE:",
                      repr(item["value"])
                  )

                  print(
                      "ATTRIBUTES:"
                  )

                  for key, value in item[
                      "attributes"
                  ].items():

                      print(
                          f"  {key}={value!r}"
                      )

              # ---------------------------------------------------------
              # 9. ELEMENTS WITH GLUX IN ID/NAME
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("GLUX ELEMENTS")
              print("=" * 80)

              glux_elements = page.locator(
                  "[id*='GLUX'], [name*='GLUX']"
              )

              print()
              print(
                  "COUNT:",
                  glux_elements.count()
              )

              for i in range(
                  min(glux_elements.count(), 100)
              ):

                  element = glux_elements.nth(i)

                  try:
                      tag = element.evaluate(
                          "(el) => el.tagName"
                      )
                  except Exception:
                      tag = ""

                  try:
                      element_id = (
                          element.get_attribute(
                              "id"
                          )
                          or ""
                      )
                  except Exception:
                      element_id = ""

                  try:
                      name = (
                          element.get_attribute(
                              "name"
                          )
                          or ""
                      )
                  except Exception:
                      name = ""

                  try:
                      text = (
                          element.inner_text()
                          .strip()
                      )
                  except Exception:
                      text = ""

                  print()
                  print(
                      f"#{i} "
                      f"TAG={tag} "
                      f"ID={element_id!r} "
                      f"NAME={name!r}"
                  )

                  if text:
                      print(
                          "TEXT:",
                          repr(text[:500])
                      )

              # ---------------------------------------------------------
              # 10. POPUP HTML
              # ---------------------------------------------------------

              print()
              print("=" * 80)
              print("POPUP HTML SEARCH")
              print("=" * 80)

              html = page.locator(
                  "body"
              ).evaluate(
                  "(el) => el.innerHTML"
              )

              marker = "GLUXZipUpdateInput"

              position = html.find(marker)

              if position >= 0:

                  start = max(
                      0,
                      position - 8000
                  )

                  end = min(
                      len(html),
                      position + 12000
                  )

                  print(
                      html[start:end]
                  )

              else:

                  print(
                      "GLUXZipUpdateInput "
                      "NOT FOUND IN BODY HTML"
                  )

              print()
              print("=" * 80)
              print("END DOM DEBUG")
              print("=" * 80)

              browser.close()
          PY
