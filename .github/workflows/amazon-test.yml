name: Amazon Offers Diagnostic

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Analyze Amazon offers
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          AMAZON_HOME = "https://www.amazon.it/"
          PRODUCT_URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON OFFERS DIAGNOSTIC")
              print("=" * 80)

              # --------------------------------------------------
              # 1. AMAZON HOME
              # --------------------------------------------------

              print()
              print("LOADING AMAZON HOME...")

              response = page.goto(
                  AMAZON_HOME,
                  wait_until="domcontentloaded",
                  timeout=45000,
              )

              print(
                  "HTTP STATUS:",
                  response.status if response else "NO RESPONSE"
              )

              page.wait_for_timeout(4000)

              # Gestione pagina intermedia
              continue_buttons = page.get_by_text(
                  "Continua con gli acquisti",
                  exact=True
              )

              target = None

              for i in range(continue_buttons.count()):

                  element = continue_buttons.nth(i)

                  try:

                      if element.is_visible():

                          target = element
                          break

                  except Exception:

                      pass

              if target:

                  print("INTERMEDIATE PAGE DETECTED")
                  print("CLICKING CONTINUE SHOPPING...")

                  target.click()

                  page.wait_for_timeout(5000)

              # --------------------------------------------------
              # 2. DELIVERY
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("CURRENT DELIVERY")
              print("=" * 80)

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "DELIVERY COUNT:",
                  delivery.count()
              )

              if delivery.count() == 0:

                  print("DELIVERY ELEMENT NOT FOUND")

                  browser.close()
                  raise SystemExit(1)

              print(
                  "DELIVERY:",
                  delivery.inner_text().strip()
              )

              # --------------------------------------------------
              # 3. SET ITALIAN CAP
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("SETTING ITALIAN CAP")
              print("=" * 80)

              delivery.click()

              page.wait_for_timeout(2000)

              cap = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              if cap.count() == 0:

                  print("CAP INPUT NOT FOUND")

                  browser.close()
                  raise SystemExit(1)

              cap.fill(CAP)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              ).first

              print(
                  "CAP:",
                  cap.input_value()
              )

              print(
                  "CONFIRM COUNT:",
                  confirm.count()
              )

              print(
                  "CONFIRM VISIBLE:",
                  confirm.is_visible()
              )

              print(
                  "CONFIRM DISABLED:",
                  confirm.is_disabled()
              )

              confirm.click()

              page.wait_for_timeout(5000)

              confirmed = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              if confirmed.count() > 0:

                  try:

                      print(
                          "CONFIRMED ZIP:",
                          repr(
                              confirmed.inner_text().strip()
                          )
                      )

                  except Exception:

                      pass

              # --------------------------------------------------
              # 4. OPEN PRODUCT
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("OPENING PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=45000,
              )

              page.wait_for_timeout(6000)

              print(
                  "PRODUCT URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              # --------------------------------------------------
              # 5. BASIC PRODUCT INFO
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("BASIC PRODUCT INFO")
              print("=" * 80)

              title = page.locator(
                  "#productTitle"
              ).first

              print(
                  "PRODUCT TITLE COUNT:",
                  title.count()
              )

              if title.count() > 0:

                  try:

                      print(
                          "PRODUCT TITLE:",
                          title.inner_text().strip()
                      )

                  except Exception:

                      pass

              delivery_product = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "DELIVERY:",
                  delivery_product.inner_text().strip()
                  if delivery_product.count() > 0
                  else "NOT FOUND"
              )

              # --------------------------------------------------
              # 6. COMPLETE BUYBOX
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("COMPLETE BUYBOX")
              print("=" * 80)

              buybox = page.locator(
                  "#buybox"
              ).first

              print(
                  "BUYBOX COUNT:",
                  buybox.count()
              )

              if buybox.count() > 0:

                  try:

                      print(
                          buybox.inner_text().strip()[:10000]
                      )

                  except Exception as e:

                      print(
                          "BUYBOX TEXT ERROR:",
                          repr(e)
                      )

              # --------------------------------------------------
              # 7. PURCHASE-RELATED TEXT
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("PURCHASE-RELATED TEXT")
              print("=" * 80)

              body_text = page.locator(
                  "body"
              ).inner_text(
                  timeout=10000
              )

              keywords = [
                  "Disponibile",
                  "Non disponibile",
                  "Esaurito",
                  "su invito",
                  "Richiedi invito",
                  "Aggiungi al carrello",
                  "Acquista ora",
                  "Visualizza tutte le opzioni di acquisto",
                  "Venduto da",
                  "Speditore",
                  "Amazon",
              ]

              for keyword in keywords:

                  print()
                  print(
                      "KEYWORD:",
                      repr(keyword)
                  )

                  found = False

                  for line in body_text.splitlines():

                      line_clean = line.strip()

                      if keyword.lower() in line_clean.lower():

                          print(
                              " ",
                              repr(line_clean[:500])
                          )

                          found = True

                  if not found:

                      print("  NOT FOUND")

              # --------------------------------------------------
              # 8. PURCHASE BUTTONS
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("PURCHASE BUTTONS")
              print("=" * 80)

              buttons = page.locator(
                  "button, input[type='submit'], input[type='button'], a"
              )

              print(
                  "TOTAL CANDIDATE ELEMENTS:",
                  buttons.count()
              )

              purchase_terms = [
                  "carrello",
                  "acquista",
                  "invito",
                  "opzioni di acquisto",
                  "disponibile",
                  "ordine",
                  "buy",
                  "cart",
              ]

              for i in range(buttons.count()):

                  element = buttons.nth(i)

                  try:

                      if not element.is_visible():
                          continue

                      text = ""

                      try:

                          text = element.inner_text().strip()

                      except Exception:

                          pass

                      aria = element.get_attribute(
                          "aria-label"
                      ) or ""

                      value = element.get_attribute(
                          "value"
                      ) or ""

                      href = element.get_attribute(
                          "href"
                      ) or ""

                      combined = " ".join(
                          [
                              text,
                              aria,
                              value,
                              href,
                          ]
                      )

                      if not any(
                          term.lower()
                          in combined.lower()
                          for term in purchase_terms
                      ):

                          continue

                      print()
                      print(
                          "ELEMENT",
                          i
                      )

                      print(
                          "  TAG:",
                          element.evaluate(
                              "(e) => e.tagName"
                          )
                      )

                      print(
                          "  TEXT:",
                          repr(text[:1000])
                      )

                      print(
                          "  ARIA:",
                          repr(aria[:1000])
                      )

                      print(
                          "  VALUE:",
                          repr(value[:1000])
                      )

                      print(
                          "  HREF:",
                          repr(href[:1000])
                      )

                      print(
                          "  ID:",
                          repr(
                              element.get_attribute("id")
                          )
                      )

                      print(
                          "  CLASS:",
                          repr(
                              element.get_attribute("class")
                          )
                      )

                      print(
                          "  DISABLED:",
                          element.is_disabled()
                          if element.evaluate(
                              "(e) => ['BUTTON','INPUT'].includes(e.tagName)"
                          )
                          else "N/A"
                      )

                  except Exception as e:

                      print(
                          "ELEMENT ERROR:",
                          repr(e)
                      )

              # --------------------------------------------------
              # 9. LINKS TO ALL PURCHASE OPTIONS
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("ALL PURCHASE OPTION LINKS")
              print("=" * 80)

              links = page.locator(
                  "a"
              )

              for i in range(links.count()):

                  link = links.nth(i)

                  try:

                      if not link.is_visible():
                          continue

                      text = link.inner_text().strip()

                      if (
                          "opzioni di acquisto"
                          in text.lower()
                          or
                          "acquista"
                          in text.lower()
                          or
                          "carrello"
                          in text.lower()
                          or
                          "invito"
                          in text.lower()
                      ):

                          print()
                          print(
                              "LINK",
                              i
                          )

                          print(
                              "  TEXT:",
                              repr(text[:1000])
                          )

                          print(
                              "  HREF:",
                              repr(
                                  link.get_attribute("href")
                              )
                          )

                          print(
                              "  ID:",
                              repr(
                                  link.get_attribute("id")
                              )
                          )

                          print(
                              "  CLASS:",
                              repr(
                                  link.get_attribute("class")
                              )
                          )

                  except Exception:

                      pass

              # --------------------------------------------------
              # 10. OFFER CONTAINERS
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("POSSIBLE OFFER CONTAINERS")
              print("=" * 80)

              selectors = [
                  "#buybox",
                  "#buybox_feature_div",
                  "#desktop_buybox",
                  "#olp_feature_div",
                  "#olp",
                  "#aod-container",
                  "#aod-offer",
                  "[id*='offer']",
                  "[class*='offer']",
              ]

              for selector in selectors:

                  try:

                      locator = page.locator(
                          selector
                      )

                      count = locator.count()

                      print()
                      print(
                          "SELECTOR:",
                          selector,
                          "COUNT:",
                          count
                      )

                      for i in range(
                          min(count, 10)
                      ):

                          element = locator.nth(i)

                          try:

                              if not element.is_visible():
                                  continue

                              text = element.inner_text().strip()

                              if text:

                                  print(
                                      "  ELEMENT",
                                      i,
                                      "TEXT:",
                                      repr(
                                          text[:3000]
                                      )
                                  )

                          except Exception:

                              pass

                  except Exception as e:

                      print(
                          "SELECTOR ERROR:",
                          selector,
                          repr(e)
                      )

              # --------------------------------------------------
              # 11. PRICE ELEMENTS
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("PRICE ELEMENTS")
              print("=" * 80)

              price_selectors = [
                  ".a-price",
                  ".a-price-whole",
                  ".a-price-fraction",
                  "#corePrice_feature_div",
                  "#apex_desktop",
                  "#price",
                  "#priceblock_ourprice",
                  "#priceblock_dealprice",
              ]

              for selector in price_selectors:

                  locator = page.locator(
                      selector
                  )

                  print(
                      selector,
                      "COUNT:",
                      locator.count()
                  )

                  for i in range(
                      min(locator.count(), 10)
                  ):

                      element = locator.nth(i)

                      try:

                          if element.is_visible():

                              print(
                                  "  TEXT:",
                                  repr(
                                      element.inner_text().strip()[:1000]
                                  )
                              )

                      except Exception:

                          pass

              # --------------------------------------------------
              # 12. FINAL BODY SNIPPET
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("BODY AROUND PURCHASE TERMS")
              print("=" * 80)

              lines = body_text.splitlines()

              interesting_indexes = []

              search_terms = [
                  "disponibile",
                  "invito",
                  "carrello",
                  "acquista",
                  "opzioni di acquisto",
                  "esaurito",
                  "non disponibile",
              ]

              for index, line in enumerate(lines):

                  if any(
                      term in line.lower()
                      for term in search_terms
                  ):

                      interesting_indexes.append(
                          index
                      )

              printed = set()

              for index in interesting_indexes:

                  start = max(
                      0,
                      index - 3
                  )

                  end = min(
                      len(lines),
                      index + 4
                  )

                  for j in range(
                      start,
                      end
                  ):

                      if j in printed:
                          continue

                      printed.add(j)

                      print(
                          f"{j}: {lines[j]}"
                      )

              print()
              print("=" * 80)
              print("END DIAGNOSTIC")
              print("=" * 80)

              browser.close()

          PY
