name: Amazon Postal Code Test 4

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect Amazon location state
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON POSTAL CODE TEST 4")
              print("=" * 80)

              print()
              print("LOADING AMAZON...")

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=45000,
                  )

                  print(
                      "HTTP STATUS:",
                      response.status if response else "NO RESPONSE"
                  )

                  print(
                      "FINAL URL:",
                      page.url
                  )

              except Exception as e:
                  print(
                      "GOTO ERROR:",
                      repr(e)
                  )

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("INITIAL PAGE CHECK")
              print("=" * 80)

              print(
                  "TITLE:",
                  repr(page.title())
              )

              print(
                  "URL:",
                  page.url
              )

              body_text = page.locator("body").inner_text(
                  timeout=10000
              )

              print()
              print("BODY LENGTH:")
              print(len(body_text))

              print()
              print("BODY FIRST 3000 CHARACTERS:")
              print(body_text[:3000])

              print()
              print("=" * 80)
              print("IMPORTANT SELECTORS")
              print("=" * 80)

              selectors = [
                  "#glow-ingress-block",
                  "#productTitle",
                  "#buybox",
                  "#add-to-cart-button",
                  "#buy-now-button",
                  "#captchacharacters",
                  "#sp-cc-accept",
                  "#nav-logo-sprites",
              ]

              for selector in selectors:

                  locator = page.locator(selector)

                  count = locator.count()

                  visible = False

                  if count > 0:

                      try:
                          visible = locator.first.is_visible()
                      except Exception:
                          pass

                  print(
                      selector,
                      "count=",
                      count,
                      "visible=",
                      visible
                  )

                  if count > 0 and visible:

                      try:
                          text = locator.first.inner_text(
                              timeout=3000
                          ).strip()

                          print(
                              "  TEXT:",
                              repr(text[:1000])
                          )

                      except Exception:
                          pass

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              if delivery.count() == 0:

                  print()
                  print("=" * 80)
                  print("DELIVERY ELEMENT NOT FOUND")
                  print("=" * 80)

                  print(
                      "Amazon did not expose #glow-ingress-block."
                  )

                  print()
                  print("COOKIES:")

                  for cookie in context.cookies():

                      print(
                          cookie["name"],
                          "=",
                          cookie["value"][:200]
                      )

                  browser.close()
                  raise SystemExit(0)

              if not delivery.is_visible():

                  print()
                  print("=" * 80)
                  print("DELIVERY ELEMENT NOT VISIBLE")
                  print("=" * 80)

                  browser.close()
                  raise SystemExit(0)

              print()
              print("=" * 80)
              print("INITIAL DELIVERY")
              print("=" * 80)

              print(
                  delivery.inner_text().strip()
              )

              print()
              print("CLICKING DELIVERY...")

              delivery.click()

              page.wait_for_timeout(2000)

              print()
              print("=" * 80)
              print("CAP DIALOG")
              print("=" * 80)

              cap = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "CAP COUNT:",
                  cap.count()
              )

              if cap.count() == 0:

                  print(
                      "CAP INPUT NOT FOUND"
                  )

                  print(
                      "BODY:",
                      page.locator("body").inner_text()[:5000]
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "CAP VISIBLE:",
                  cap.is_visible()
              )

              cap.fill(CAP)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              ).first

              print(
                  "CONFIRM COUNT:",
                  confirm.count()
              )

              if confirm.count() == 0:

                  print(
                      "CAP CONFIRM NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "CONFIRM VISIBLE:",
                  confirm.is_visible()
              )

              print(
                  "CONFIRM DISABLED:",
                  confirm.is_disabled()
              )

              print()
              print("=" * 80)
              print("BEFORE CAP CONFIRM")
              print("=" * 80)

              print(
                  "CAP:",
                  cap.input_value()
              )

              print()
              print("COOKIES BEFORE CAP CONFIRM:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:200]
                  )

              print()
              print("CLICKING CAP CONFIRM...")

              confirm.click()

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("AFTER CAP CONFIRM")
              print("=" * 80)

              confirmed = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              print(
                  "CONFIRMED ZIP COUNT:",
                  confirmed.count()
              )

              if confirmed.count() > 0:

                  try:
                      print(
                          "CONFIRMED ZIP:",
                          repr(
                              confirmed.inner_text().strip()
                          )
                      )
                  except Exception:
                      pass

              print()
              print("COOKIES AFTER CAP CONFIRM:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:300]
                  )

              print()
              print("=" * 80)
              print("SUCCESS DIALOG")
              print("=" * 80)

              success = page.locator(
                  "#GLUXHiddenSuccessDialog"
              ).first

              print(
                  "COUNT:",
                  success.count()
              )

              if success.count() > 0:

                  print(
                      "VISIBLE:",
                      success.is_visible()
                  )

                  try:
                      print(
                          success.inner_text().strip()
                      )
                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("CONFIRM CLOSE")
              print("=" * 80)

              close = page.locator(
                  "#GLUXConfirmClose"
              ).first

              print(
                  "COUNT:",
                  close.count()
              )

              if close.count() > 0:

                  print(
                      "VISIBLE:",
                      close.is_visible()
                  )

                  print(
                      "DISABLED:",
                      close.is_disabled()
                  )

                  try:
                      print(
                          "TEXT:",
                          repr(
                              close.get_attribute("value")
                          )
                      )
                  except Exception:
                      pass

              if close.count() > 0 and close.is_visible():

                  print()
                  print("CLICKING CONFIRM CLOSE...")

                  close.click()

                  page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("AFTER CLOSING")
              print("=" * 80)

              delivery_final = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "DELIVERY COUNT:",
                  delivery_final.count()
              )

              if delivery_final.count() > 0:

                  try:
                      print(
                          "DELIVERY:",
                          delivery_final.inner_text().strip()
                      )
                  except Exception as e:
                      print(
                          "DELIVERY ERROR:",
                          repr(e)
                      )

              print()
              print("COOKIES AFTER CLOSING:")

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:300]
                  )

              print()
              print("=" * 80)
              print("FINAL BUYBOX")
              print("=" * 80)

              buybox = page.locator(
                  "#buybox"
              ).first

              print(
                  "BUYBOX COUNT:",
                  buybox.count()
              )

              if buybox.count() > 0:

                  try:
                      print(
                          buybox.inner_text().strip()[:3000]
                      )
                  except Exception as e:
                      print(
                          "BUYBOX ERROR:",
                          repr(e)
                      )

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()

          PY
