name: Amazon Delivery Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Italian delivery location
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON ITALIAN DELIVERY TEST")
              print("=" * 80)

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(4000)

              print()
              print("INITIAL DELIVERY:")

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              if delivery.count() > 0:
                  print(
                      delivery.inner_text().strip()
                  )
              else:
                  print(
                      "Delivery element not found"
                  )

              print()
              print("OPENING DELIVERY POPUP...")

              if delivery.count() == 0:
                  browser.close()
                  raise SystemExit(
                      "ERROR: delivery element not found"
                  )

              delivery.click()

              page.wait_for_timeout(1500)

              print()
              print("CAP FIELD:")

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "COUNT:",
                  cap_input.count()
              )

              if cap_input.count() == 0:
                  browser.close()
                  raise SystemExit(
                      "ERROR: CAP field not found"
                  )

              print(
                  "VISIBLE:",
                  cap_input.is_visible()
              )

              print(
                  "ARIA:",
                  cap_input.get_attribute(
                      "aria-label"
                  )
              )

              print()
              print(
                  f"ENTERING CAP: {CAP}"
              )

              cap_input.fill(CAP)

              print(
                  "CAP VALUE:",
                  cap_input.input_value()
              )

              page.wait_for_timeout(500)

              print()
              print("CLICKING FATTO...")

              done_button = page.locator(
                  "button[name='glowDoneButton']"
              ).first

              print(
                  "FATTO COUNT:",
                  done_button.count()
              )

              if done_button.count() == 0:
                  browser.close()
                  raise SystemExit(
                      "ERROR: Fatto button not found"
                  )

              print(
                  "FATTO VISIBLE:",
                  done_button.is_visible()
              )

              done_button.click()

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("FINAL DELIVERY STATE")
              print("=" * 80)

              final_delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              if final_delivery.count() > 0:

                  final_text = (
                      final_delivery
                      .inner_text()
                      .strip()
                  )

                  print(final_text)

              else:

                  print(
                      "Final delivery element "
                      "not found"
                  )

              print()
              print("FINAL URL:")
              print(page.url)

              print()
              print("=" * 80)
              print("PRODUCT INFORMATION")
              print("=" * 80)

              title = page.locator(
                  "#productTitle"
              ).first

              if title.count() > 0:
                  print()
                  print("PRODUCT:")
                  print(
                      title.inner_text().strip()
                  )

              print()
              print("BUYBOX COUNT:")

              buybox = page.locator(
                  "#buybox"
              )

              print(
                  buybox.count()
              )

              print()
              print("ADD TO CART COUNT:")

              add_to_cart = page.locator(
                  "#add-to-cart-button"
              )

              print(
                  add_to_cart.count()
              )

              print()
              print("BUY NOW COUNT:")

              buy_now = page.locator(
                  "#buy-now-button"
              )

              print(
                  buy_now.count()
              )

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()
          PY
