name: Amazon Page Stability Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON PAGE STABILITY TEST")
              print("=" * 80)

              print()
              print("1. OPENING PAGE...")

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              print()
              print("HTTP STATUS:")
              print(
                  response.status
                  if response
                  else "NO RESPONSE"
              )

              print()
              print("URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(repr(page.title()))

              print()
              print("=" * 80)
              print("2. WAITING")
              print("=" * 80)

              page.wait_for_timeout(5000)

              print()
              print("URL AFTER WAIT:")
              print(page.url)

              print()
              print("TITLE AFTER WAIT:")
              print(repr(page.title()))

              print()
              print("=" * 80)
              print("3. IMPORTANT ELEMENTS")
              print("=" * 80)

              selectors = [
                  "#productTitle",
                  "h1",
                  "#glow-ingress-block",
                  "#add-to-cart-button",
                  "#buy-now-button",
                  "#buybox",
                  "#nav-logo-sprites",
                  "#captchacharacters",
                  "form[action='/errors/validateCaptcha']",
                  "#sp-cc-accept",
              ]

              for selector in selectors:

                  locator = page.locator(selector)

                  print()
                  print(selector)
                  print("COUNT:", locator.count())

                  if locator.count() > 0:

                      try:
                          print(
                              "VISIBLE:",
                              locator.first.is_visible()
                          )
                      except Exception:
                          pass

                      try:
                          text = locator.first.inner_text().strip()
                          if text:
                              print(
                                  "TEXT:",
                                  repr(text[:300])
                              )
                      except Exception:
                          pass

              print()
              print("=" * 80)
              print("4. BODY TEXT")
              print("=" * 80)

              try:

                  body_text = page.locator(
                      "body"
                  ).inner_text().strip()

                  print(
                      body_text[:8000]
                  )

              except Exception as e:

                  print(
                      "BODY ERROR:",
                      repr(e)
                  )

              print()
              print("=" * 80)
              print("5. COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  print(
                      cookie["name"],
                      "=",
                      cookie["value"][:100]
                  )

              print()
              print("=" * 80)
              print("6. HTML SIZE")
              print("=" * 80)

              try:

                  html = page.content()

                  print(
                      "HTML LENGTH:",
                      len(html)
                  )

                  print()
                  print(
                      "HAS PRODUCT TITLE:",
                      "B0H9HFPRRD" in html
                      or "Pokémon" in html
                      or "Pokemon" in html
                  )

                  print(
                      "HAS DELIVERY:",
                      "glow-ingress-block" in html
                  )

                  print(
                      "HAS CAPTCHA:",
                      "captcha" in html.lower()
                  )

              except Exception as e:

                  print(
                      "HTML ERROR:",
                      repr(e)
                  )

              browser.close()

          PY
