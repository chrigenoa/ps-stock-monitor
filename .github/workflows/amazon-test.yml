name: Amazon Delivery Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon delivery location
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON DELIVERY LOCATION TEST")
              print("=" * 80)

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("DELIVERY SELECTORS")
              print("=" * 80)

              selectors = [
                  "#glow-ingress-block",
                  "#glow-ingress-line1",
                  "#glow-ingress-line2",
                  "#nav-global-location-popover-link",
                  "#contextualIngressPt",
                  "#contextualIngressPtLabel",
              ]

              delivery_element = None
              delivery_selector = None

              for selector in selectors:

                  locator = page.locator(selector)

                  count = locator.count()

                  print()
                  print(
                      f"SELECTOR {selector}: {count}"
                  )

                  if count == 0:
                      continue

                  for i in range(count):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      try:
                          text = (
                              element.inner_text()
                              .strip()
                          )
                      except Exception:
                          text = ""

                      print(
                          f"  #{i} "
                          f"visible={visible} "
                          f"text={text!r}"
                      )

                      if (
                          delivery_element is None
                          and visible
                      ):
                          delivery_element = element
                          delivery_selector = selector

              print()

              if delivery_element is None:

                  print(
                      "ERROR: NO VISIBLE DELIVERY "
                      "ELEMENT FOUND."
                  )

                  print()
                  print("=" * 80)
                  print("PAGE INFORMATION")
                  print("=" * 80)

                  print()
                  print("URL:")
                  print(page.url)

                  print()
                  print("TITLE:")
                  print(page.title())

                  print()
                  print("BODY DELIVERY TEXT SEARCH:")

                  body_text = page.locator(
                      "body"
                  ).inner_text()

                  for line in body_text.splitlines():

                      line = line.strip()

                      if (
                          "indirizzo di consegna"
                          in line.lower()
                          or "stati uniti"
                          in line.lower()
                      ):
                          print(line)

                  browser.close()
                  raise SystemExit(1)

              print(
                  "SELECTED DELIVERY ELEMENT:",
                  delivery_selector
              )

              print()
              print("INITIAL DELIVERY TEXT:")

              print(
                  delivery_element
                  .inner_text()
                  .strip()
              )

              print()
              print("=" * 80)
              print("OPENING DELIVERY POPUP")
              print("=" * 80)

              delivery_element.click()

              page.wait_for_timeout(1500)

              print()
              print("=" * 80)
              print("CAP FIELD")
              print("=" * 80)

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "COUNT:",
                  cap_input.count()
              )

              if cap_input.count() == 0:

                  print(
                      "ERROR: CAP FIELD NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  cap_input.is_visible()
              )

              print(
                  "ARIA:",
                  cap_input.get_attribute(
                      "aria-label"
                  )
              )

              print()
              print(
                  f"ENTERING CAP: {CAP}"
              )

              cap_input.fill(CAP)

              print(
                  "CAP VALUE:",
                  cap_input.input_value()
              )

              page.wait_for_timeout(500)

              print()
              print("=" * 80)
              print("CLICKING FATTO")
              print("=" * 80)

              done_button = page.locator(
                  "button[name='glowDoneButton']"
              ).first

              print(
                  "COUNT:",
                  done_button.count()
              )

              if done_button.count() == 0:

                  print(
                      "ERROR: FATTO BUTTON NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  done_button.is_visible()
              )

              done_button.click()

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("FINAL DELIVERY STATE")
              print("=" * 80)

              final_selectors = [
                  "#glow-ingress-block",
                  "#glow-ingress-line1",
                  "#glow-ingress-line2",
              ]

              final_found = False

              for selector in final_selectors:

                  locator = page.locator(selector)

                  if locator.count() == 0:
                      continue

                  for i in range(locator.count()):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      if not visible:
                          continue

                      try:
                          text = (
                              element.inner_text()
                              .strip()
                          )
                      except Exception:
                          text = ""

                      print()
                      print(
                          f"{selector} "
                          f"visible={visible}"
                      )
                      print(text)

                      final_found = True

              if not final_found:

                  print(
                      "No final delivery element "
                      "found."
                  )

              print()
              print("=" * 80)
              print("DELIVERY TEXT FROM PAGE")
              print("=" * 80)

              body_text = page.locator(
                  "body"
              ).inner_text()

              for line in body_text.splitlines():

                  line = line.strip()

                  if (
                      "indirizzo di consegna"
                      in line.lower()
                      or "00100"
                      in line
                      or "roma"
                      in line.lower()
                      or "stati uniti"
                      in line.lower()
                  ):
                      print(line)

              print()
              print("=" * 80)
              print("PRODUCT")
              print("=" * 80)

              title = page.locator(
                  "#productTitle"
              ).first

              if title.count() > 0:

                  print()
                  print(
                      title.inner_text().strip()
                  )

              print()
              print("ADD TO CART:",
                    page.locator(
                        "#add-to-cart-button"
                    ).count())

              print(
                  "BUY NOW:",
                  page.locator(
                      "#buy-now-button"
                  ).count()
              )

              print()
              print("URL:")
              print(page.url)

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()
          PY
