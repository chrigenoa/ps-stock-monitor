name: Amazon Stock Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon adapter
        run: |
          python - <<'PY'
          from sites.amazon import check_stock

          url = (
              "https://www.amazon.it/dp/B0H9HFPRRD/"
          )

          print("=" * 80)
          print("AMAZON STOCK ADAPTER TEST")
          print("=" * 80)
          print()
          print("ASIN:")
          print("B0H9HFPRRD")
          print()
          print("URL:")
          print(url)
          print()
          print("Running check_stock()...")
          print()

          result = check_stock(url)

          print("=" * 80)
          print("RESULT")
          print("=" * 80)
          print(result)
          print("=" * 80)

          if result not in (
              "AVAILABLE",
              "OUT_OF_STOCK",
              "UNKNOWN",
              "ERROR",
          ):
              print()
              print("TEST FAILED")
              print("Invalid adapter result:", result)
              raise SystemExit(1)

          print()
          print("TEST PASSED")
          print("Adapter returned a valid stock state.")
          PY
