name: Amazon Postal Code Test

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon Italian postal code
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON POSTAL CODE TEST")
              print("=" * 80)

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              print()
              print("WAITING FOR DELIVERY ELEMENT...")

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              try:
                  delivery.wait_for(
                      state="visible",
                      timeout=15000,
                  )
              except Exception:
                  print(
                      "ERROR: DELIVERY ELEMENT DID NOT "
                      "BECOME VISIBLE"
                  )

                  print()
                  print("URL:")
                  print(page.url)

                  print()
                  print("TITLE:")
                  print(page.title())

                  browser.close()
                  raise SystemExit(1)

              page.wait_for_timeout(1000)

              print()
              print("=" * 80)
              print("INITIAL DELIVERY")
              print("=" * 80)

              print(
                  delivery.inner_text().strip()
              )

              print()
              print("CLICKING DELIVERY...")

              delivery.click()

              page.wait_for_timeout(1500)

              print()
              print("=" * 80)
              print("CAP INPUT")
              print("=" * 80)

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "COUNT:",
                  cap_input.count()
              )

              if cap_input.count() == 0:
                  print(
                      "ERROR: CAP INPUT NOT FOUND"
                  )

                  print()
                  print("POPUP TEXT:")

                  try:
                      print(
                          page.locator(
                              "body"
                          ).inner_text()
                      )
                  except Exception:
                      pass

                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  cap_input.is_visible()
              )

              print(
                  "DATA-ACTION:",
                  cap_input.get_attribute(
                      "data-action"
                  )
              )

              print(
                  "ARIA:",
                  cap_input.get_attribute(
                      "aria-label"
                  )
              )

              print()
              print(
                  "FILLING CAP:",
                  CAP
              )

              cap_input.fill(CAP)

              print(
                  "VALUE AFTER FILL:",
                  cap_input.input_value()
              )

              page.wait_for_timeout(500)

              print()
              print("=" * 80)
              print("REAL CAP CONFIRM BUTTON")
              print("=" * 80)

              confirm_selectors = [
                  "#GLUXZipInputSection input[type='submit']",
                  "#GLUXZipUpdate input[type='submit']",
                  "input[type='submit'][aria-labelledby='GLUXZipUpdate-announce']",
              ]

              confirm_button = None
              confirm_selector = None

              for selector in confirm_selectors:

                  locator = page.locator(
                      selector
                  )

                  print()
                  print(
                      "SELECTOR:",
                      selector
                  )

                  print(
                      "COUNT:",
                      locator.count()
                  )

                  for i in range(
                      locator.count()
                  ):

                      element = locator.nth(i)

                      try:
                          visible = element.is_visible()
                      except Exception:
                          visible = False

                      print(
                          f"  #{i} "
                          f"visible={visible}"
                      )

                      if (
                          confirm_button is None
                          and visible
                      ):
                          confirm_button = element
                          confirm_selector = selector

              if confirm_button is None:

                  print()
                  print(
                      "ERROR: REAL CAP CONFIRM "
                      "BUTTON NOT FOUND"
                  )

                  browser.close()
                  raise SystemExit(1)

              print()
              print(
                  "SELECTED:",
                  confirm_selector
              )

              print(
                  "TYPE:",
                  confirm_button.get_attribute(
                      "type"
                  )
              )

              print(
                  "ARIA-LABELLED-BY:",
                  confirm_button.get_attribute(
                      "aria-labelledby"
                  )
              )

              print(
                  "DISABLED:",
                  confirm_button.is_disabled()
              )

              print()
              print("=" * 80)
              print("CLICKING REAL CAP CONFIRM")
              print("=" * 80)

              confirm_button.click()

              print(
                  "CLICK SENT"
              )

              page.wait_for_timeout(3000)

              print()
              print("=" * 80)
              print("CAP SUCCESS DIALOG")
              print("=" * 80)

              success_dialog = page.locator(
                  "#GLUXHiddenSuccessDialog"
              ).first

              print(
                  "COUNT:",
                  success_dialog.count()
              )

              if success_dialog.count() > 0:

                  print(
                      "VISIBLE:",
                      success_dialog.is_visible()
                  )

                  print(
                      "TEXT:"
                  )

                  print(
                      success_dialog.inner_text().strip()
                  )

              print()
              print("=" * 80)
              print("CONFIRMED ZIP")
              print("=" * 80)

              confirmed_zip = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              print(
                  "COUNT:",
                  confirmed_zip.count()
              )

              if confirmed_zip.count() > 0:

                  print(
                      "VISIBLE:",
                      confirmed_zip.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          confirmed_zip.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("ZIP ERROR")
              print("=" * 80)

              zip_error = page.locator(
                  "#GLUXZipError"
              ).first

              if zip_error.count() > 0:

                  print(
                      "VISIBLE:",
                      zip_error.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          zip_error.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("SERVER ERROR")
              print("=" * 80)

              server_error = page.locator(
                  "#GLUXZipServerError"
              ).first

              if server_error.count() > 0:

                  print(
                      "VISIBLE:",
                      server_error.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          server_error.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("CONTINUE")
              print("=" * 80)

              continue_button = page.locator(
                  "#GLUXConfirmClose"
              ).first

              print(
                  "COUNT:",
                  continue_button.count()
              )

              if continue_button.count() > 0:

                  print(
                      "VISIBLE:",
                      continue_button.is_visible()
                  )

                  print(
                      "TAG:",
                      continue_button.evaluate(
                          "(el) => el.tagName"
                      )
                  )

                  print(
                      "TYPE:",
                      continue_button.get_attribute(
                          "type"
                      )
                  )

              if (
                  continue_button.count() > 0
                  and continue_button.is_visible()
              ):

                  print()
                  print(
                      "CLICKING CONTINUE..."
                  )

                  continue_button.click()

                  page.wait_for_timeout(5000)

              else:

                  print(
                      "CONTINUE NOT CLICKED"
                  )

              print()
              print("=" * 80)
              print("FINAL DELIVERY")
              print("=" * 80)

              final_delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              if final_delivery.count() > 0:

                  print(
                      "VISIBLE:",
                      final_delivery.is_visible()
                  )

                  print(
                      "TEXT:"
                  )

                  print(
                      final_delivery.inner_text().strip()
                  )

              print()
              print("=" * 80)
              print("PRODUCT")
              print("=" * 80)

              title = page.locator(
                  "#productTitle"
              ).first

              if title.count() > 0:

                  print(
                      title.inner_text().strip()
                  )

              print()
              print(
                  "ADD TO CART:",
                  page.locator(
                      "#add-to-cart-button"
                  ).count()
              )

              print(
                  "BUY NOW:",
                  page.locator(
                      "#buy-now-button"
                  ).count()
              )

              print()
              print("=" * 80)
              print("FINAL URL")
              print("=" * 80)

              print(page.url)

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()
          PY
