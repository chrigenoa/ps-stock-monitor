name: Amazon Postal Code Test 2

on:
  workflow_dispatch:

jobs:
  test-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon Italian postal code
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.amazon.it/dp/B0H9HFPRRD/"
          CAP = "00100"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("AMAZON POSTAL CODE TEST 2")
              print("=" * 80)

              print()
              print("OPENING PRODUCT PAGE...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(3000)

              print()
              print("TITLE:")
              print(page.title())

              print()
              print("=" * 80)
              print("INITIAL DELIVERY")
              print("=" * 80)

              delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "COUNT:",
                  delivery.count()
              )

              print(
                  "VISIBLE:",
                  delivery.is_visible()
                  if delivery.count() > 0
                  else False
              )

              if delivery.count() == 0:
                  print(
                      "ERROR: DELIVERY ELEMENT NOT FOUND"
                  )
                  browser.close()
                  raise SystemExit(1)

              print(
                  "TEXT:"
              )
              print(
                  delivery.inner_text().strip()
              )

              print()
              print("CLICKING DELIVERY...")

              delivery.click()

              page.wait_for_timeout(1500)

              print()
              print("=" * 80)
              print("CAP WINDOW")
              print("=" * 80)

              cap_input = page.locator(
                  "#GLUXZipUpdateInput"
              ).first

              print(
                  "CAP COUNT:",
                  cap_input.count()
              )

              if cap_input.count() == 0:
                  print(
                      "ERROR: CAP INPUT NOT FOUND"
                  )
                  print()
                  print("BODY:")
                  print(
                      page.locator(
                          "body"
                      ).inner_text()[:5000]
                  )
                  browser.close()
                  raise SystemExit(1)

              print(
                  "CAP VISIBLE:",
                  cap_input.is_visible()
              )

              print(
                  "CAP ARIA:",
                  cap_input.get_attribute(
                      "aria-label"
                  )
              )

              print()
              print(
                  "FILLING CAP:",
                  CAP
              )

              cap_input.fill(CAP)

              print(
                  "CAP VALUE:",
                  cap_input.input_value()
              )

              page.wait_for_timeout(500)

              print()
              print("=" * 80)
              print("CAP CONFIRM")
              print("=" * 80)

              confirm = page.locator(
                  "#GLUXZipInputSection input[type='submit']"
              ).first

              print(
                  "CONFIRM COUNT:",
                  confirm.count()
              )

              if confirm.count() == 0:

                  print(
                      "ERROR: CAP CONFIRM NOT FOUND"
                  )

                  print()
                  print(
                      "ALL SUBMIT INPUTS:"
                  )

                  submits = page.locator(
                      "input[type='submit']"
                  )

                  for i in range(
                      submits.count()
                  ):

                      element = submits.nth(i)

                      try:
                          print(
                              i,
                              "visible=",
                              element.is_visible(),
                              "id=",
                              element.get_attribute("id"),
                              "aria-labelledby=",
                              element.get_attribute(
                                  "aria-labelledby"
                              )
                          )
                      except Exception:
                          pass

                  browser.close()
                  raise SystemExit(1)

              print(
                  "VISIBLE:",
                  confirm.is_visible()
              )

              print(
                  "DISABLED:",
                  confirm.is_disabled()
              )

              print(
                  "TYPE:",
                  confirm.get_attribute(
                      "type"
                  )
              )

              print(
                  "ARIA-LABELLED-BY:",
                  confirm.get_attribute(
                      "aria-labelledby"
                  )
              )

              print()
              print(
                  "CLICKING CAP CONFIRM..."
              )

              confirm.click()

              print(
                  "CLICK SENT"
              )

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("SUCCESS DIALOG")
              print("=" * 80)

              success = page.locator(
                  "#GLUXHiddenSuccessDialog"
              ).first

              print(
                  "COUNT:",
                  success.count()
              )

              if success.count() > 0:

                  print(
                      "VISIBLE:",
                      success.is_visible()
                  )

                  print(
                      "TEXT:"
                  )

                  print(
                      success.inner_text().strip()
                  )

              print()
              print("=" * 80)
              print("CONFIRMED ZIP")
              print("=" * 80)

              confirmed = page.locator(
                  "#GLUXZipConfirmationValue"
              ).first

              print(
                  "COUNT:",
                  confirmed.count()
              )

              if confirmed.count() > 0:

                  print(
                      "VISIBLE:",
                      confirmed.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          confirmed.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("ZIP ERROR")
              print("=" * 80)

              error = page.locator(
                  "#GLUXZipError"
              ).first

              if error.count() > 0:

                  print(
                      "VISIBLE:",
                      error.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          error.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("SERVER ERROR")
              print("=" * 80)

              server_error = page.locator(
                  "#GLUXZipServerError"
              ).first

              if server_error.count() > 0:

                  print(
                      "VISIBLE:",
                      server_error.is_visible()
                  )

                  print(
                      "TEXT:",
                      repr(
                          server_error.inner_text().strip()
                      )
                  )

              print()
              print("=" * 80)
              print("CONTINUE BUTTON")
              print("=" * 80)

              continue_button = page.locator(
                  "#GLUXConfirmClose"
              ).first

              print(
                  "COUNT:",
                  continue_button.count()
              )

              if continue_button.count() > 0:

                  print(
                      "VISIBLE:",
                      continue_button.is_visible()
                  )

                  print(
                      "TAG:",
                      continue_button.evaluate(
                          "(el) => el.tagName"
                      )
                  )

                  print(
                      "TYPE:",
                      continue_button.get_attribute(
                          "type"
                      )
                  )

                  print(
                      "VALUE:",
                      continue_button.get_attribute(
                          "value"
                      )
                  )

                  print(
                      "TEXT:",
                      repr(
                          continue_button.inner_text().strip()
                      )
                  )

              if (
                  continue_button.count() > 0
                  and continue_button.is_visible()
              ):

                  print()
                  print(
                      "CLICKING CONTINUE..."
                  )

                  continue_button.click()

                  page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("FINAL DELIVERY")
              print("=" * 80)

              final_delivery = page.locator(
                  "#glow-ingress-block"
              ).first

              print(
                  "COUNT:",
                  final_delivery.count()
              )

              if final_delivery.count() > 0:

                  print(
                      "VISIBLE:",
                      final_delivery.is_visible()
                  )

                  print(
                      "TEXT:"
                  )

                  print(
                      final_delivery.inner_text().strip()
                  )

              print()
              print("=" * 80)
              print("FINAL PRODUCT STATE")
              print("=" * 80)

              print(
                  "PRODUCT TITLE:",
                  page.locator(
                      "#productTitle"
                  ).first.inner_text().strip()
              )

              buybox = page.locator(
                  "#buybox"
              ).first

              print()
              print("BUYBOX COUNT:", buybox.count())

              if buybox.count() > 0:

                  print(
                      "BUYBOX TEXT:"
                  )

                  print(
                      buybox.inner_text().strip()[:3000]
                  )

              print()
              print("=" * 80)
              print("COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  if cookie["name"] in [
                      "lc-acbit",
                      "i18n-prefs",
                      "session-id",
                  ]:

                      print(
                          cookie["name"],
                          "=",
                          cookie["value"][:100]
                      )

              print()
              print("=" * 80)
              print("FINAL URL")
              print("=" * 80)

              print(page.url)

              print()
              print("=" * 80)
              print("END TEST")
              print("=" * 80)

              browser.close()
          PY
