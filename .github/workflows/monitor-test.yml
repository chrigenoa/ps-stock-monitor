name: Stock Monitor Test

on:
  workflow_dispatch:

jobs:
  test-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run stock monitor
        run: |
          python stock_monitor.py

      - name: Show stock state
        run: |
          echo "===== stock_state.json ====="
          cat stock_state.json

      - name: Save stock state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json

          if git diff --cached --quiet; then
            echo "No changes to stock state."
          else
            git commit -m "Update stock state"
            git push
          fi
