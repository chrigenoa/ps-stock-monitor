name: Full Stock Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_monitor.py

      - name: Show stock state
        run: |
          echo "========================================"
          echo "STOCK STATE"
          echo "========================================"
          cat stock_state.json

      - name: Commit updated stock state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json

          if git diff --cached --quiet; then
            echo "No stock state changes to commit."
          else
            git commit -m "Update stock state"
            git push
          fi
```
