name: Playwright Stock Parser Test

on:
  workflow_dispatch:

jobs:
  test-stock-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Test PlayStation Direct parser
        run: |
          cat > test_parser.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          PRODUCTS = [
              {
                  "name": "Wolverine Battle Yellow Console Covers",
                  "url": "https://direct.playstation.com/it-it/buy-accessories/playstation5-pro-console-covers-marvels-wolverine-battle-yellow-limited-edition",
                  "expected": "OUT_OF_STOCK",
              },
              {
                  "name": "PS5 Pro Console",
                  "url": "https://direct.playstation.com/it-it/buy-consoles/playstation5-pro-console",
                  "expected": "OUT_OF_STOCK",
              },
              {
                  "name": "DualSense Wolverine Battle Yellow",
                  "url": "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-marvels-wolverine-battle-yellow-limited-edition-for-ps5-pc-mac-mobile",
                  "expected": "OUT_OF_STOCK",
              },
              {
                  "name": "DualSense GTA VI Black",
                  "url": "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-grand-theft-auto-vi-black-limited-edition-for-ps5-pc-mac-mobile",
                  "expected": "OUT_OF_STOCK",
              },
              {
                  "name": "DualSense GTA VI White",
                  "url": "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-grand-theft-auto-vi-white-limited-edition-for-ps5-pc-mac-mobile",
                  "expected": "OUT_OF_STOCK",
              },
              {
                  "name": "DualSense Wolverine Adamantium",
                  "url": "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-marvels-wolverine-adamantium-limited-edition-for-ps5-pc-mac-mobile",
                  "expected": "AVAILABLE",
              },
          ]

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def detect_stock(page):
              """
              Detects stock using ONLY the main product hero component.

              Important:
              - We do NOT use page-wide "non disponibile".
              - We do NOT use generic page-wide "Aggiungi al carrello".
              - We specifically look for the main product's
                `.add-to-cart` button.
              """

              h1 = page.locator("h1").first

              if h1.count() == 0:
                  return "UNKNOWN", "H1 not found"

              # The H1 is directly inside the productHero component.
              hero = h1.locator("xpath=..")

              if hero.count() == 0:
                  return "UNKNOWN", "Product hero not found"

              # The main product uses:
              # .add-to-cart
              #
              # Related products use:
              # .js-add-to-cart
              #
              # Therefore we deliberately select only .add-to-cart.
              buttons = hero.locator("button.add-to-cart")

              count = buttons.count()

              if count == 0:
                  return "UNKNOWN", "Main add-to-cart button not found"

              visible_buttons = []

              for i in range(count):
                  button = buttons.nth(i)

                  try:
                      visible = button.is_visible()
                  except Exception:
                      visible = False

                  try:
                      enabled = button.is_enabled()
                  except Exception:
                      enabled = False

                  try:
                      text = clean(button.inner_text())
                  except Exception:
                      text = ""

                  visible_buttons.append(
                      {
                          "visible": visible,
                          "enabled": enabled,
                          "text": text,
                      }
                  )

              # Any visible + enabled main-product CTA means available.
              for button in visible_buttons:
                  if (
                      button["visible"]
                      and button["enabled"]
                      and "aggiungi al carrello" in button["text"].lower()
                  ):
                      return "AVAILABLE", "Visible main add-to-cart"

              # If the main CTA exists but is hidden, the product is out of stock.
              if visible_buttons:
                  return "OUT_OF_STOCK", "Main add-to-cart hidden"

              return "UNKNOWN", "Unable to determine"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              results = []
              total_start = time.time()

              print()
              print("=" * 100)
              print("PLAYSTATION DIRECT STOCK PARSER TEST")
              print("=" * 100)
              print()

              for product in PRODUCTS:

                  start = time.time()

                  try:
                      response = page.goto(
                          product["url"],
                          wait_until="domcontentloaded",
                          timeout=30000,
                      )

                      page.wait_for_timeout(1500)

                      status, reason = detect_stock(page)

                      elapsed = time.time() - start

                      expected = product["expected"]
                      correct = status == expected

                      results.append(correct)

                      symbol = "OK" if correct else "FAIL"

                      print(
                          f"[{symbol}] "
                          f"{product['name']}: "
                          f"{status} "
                          f"(expected {expected}) "
                          f"| {elapsed:.2f}s"
                      )

                      print(f"     reason: {reason}")

                      if response:
                          print(f"     HTTP: {response.status}")

                      print(f"     URL: {page.url}")
                      print()

                  except Exception as exc:

                      results.append(False)

                      print(
                          f"[FAIL] "
                          f"{product['name']}: ERROR"
                      )

                      print(f"     {type(exc).__name__}: {exc}")
                      print()

              total_time = time.time() - total_start

              print("=" * 100)
              print("FINAL RESULT")
              print("=" * 100)

              passed = sum(results)
              total = len(results)

              print(
                  f"Passed: {passed}/{total}"
              )

              print(
                  f"Total time: {total_time:.2f}s"
              )

              print()

              if passed == total:
                  print("SUCCESS: ALL PARSER TESTS PASSED")
              else:
                  print("FAILURE: ONE OR MORE PARSER TESTS FAILED")

              print("=" * 100)

              browser.close()

              # Fail the GitHub Action if the parser is wrong.
              if passed != total:
                  raise SystemExit(1)

          PY

          python test_parser.py
