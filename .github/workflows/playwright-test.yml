name: Playwright DOM Diagnostic Short

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Diagnose product containers
        run: |
          cat > diagnose.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re

          PRODUCTS = [
              (
                  "ADAMANTIUM",
                  "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-marvels-wolverine-adamantium-limited-edition-for-ps5-pc-mac-mobile"
              ),
              (
                  "BATTLE_YELLOW",
                  "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-marvels-wolverine-battle-yellow-limited-edition-for-ps5-pc-mac-mobile"
              ),
          ]

          def clean(s):
              return re.sub(r"\s+", " ", s or "").strip()

          def short(s, n=350):
              s = clean(s)
              return s if len(s) <= n else s[:n] + "..."

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"]
              )

              page = browser.new_page(
                  locale="it-IT",
                  viewport={"width": 1440, "height": 1000}
              )

              for name, url in PRODUCTS:

                  print()
                  print("=" * 90)
                  print(name)
                  print("=" * 90)

                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=30000
                  )

                  page.wait_for_timeout(2000)

                  h1 = page.locator("h1").first

                  if h1.count() == 0:
                      print("ERROR: H1 NOT FOUND")
                      continue

                  h1_text = clean(h1.inner_text())

                  print("H1:", h1_text)

                  # Salviamo l'H1 in una variabile JS e risaliamo
                  # nella struttura DOM.
                  result = page.evaluate("""
                  () => {
                      const h1 = document.querySelector('h1');

                      if (!h1) return [];

                      const result = [];
                      let el = h1;

                      for (let level = 0; level <= 8 && el; level++, el = el.parentElement) {

                          const buttons = [...el.querySelectorAll('button')];

                          const relevantButtons = buttons
                              .filter(b => {
                                  const t = (b.innerText || '').trim().toLowerCase();
                                  return (
                                      t.includes('aggiungi al carrello') ||
                                      t.includes('accedi per acquistare') ||
                                      t.includes('acquista') ||
                                      t.includes('non disponibile')
                                  );
                              })
                              .map(b => ({
                                  text: (b.innerText || '').trim(),
                                  visible: !!(b.offsetWidth || b.offsetHeight || b.getClientRects().length),
                                  disabled: b.disabled,
                                  ariaDisabled: b.getAttribute('aria-disabled'),
                                  class: b.className,
                                  id: b.id
                              }));

                          result.push({
                              level: level,
                              tag: el.tagName,
                              id: el.id,
                              class: el.className,
                              role: el.getAttribute('role'),
                              buttonCount: buttons.length,
                              relevantButtons: relevantButtons,
                              text: (el.innerText || '').trim().replace(/\\s+/g, ' ').substring(0, 500)
                          });
                      }

                      return result;
                  }
                  """)

                  for item in result:

                      print()
                      print(
                          f"LEVEL {item['level']} | "
                          f"<{item['tag'].lower()}> | "
                          f"id={item['id']!r}"
                      )

                      print(
                          "CLASS:",
                          short(str(item["class"]), 250)
                      )

                      print(
                          "ROLE:",
                          item["role"]
                      )

                      print(
                          "BUTTON COUNT:",
                          item["buttonCount"]
                      )

                      print(
                          "TEXT:",
                          short(item["text"])
                      )

                      for b in item["relevantButtons"]:
                          print(
                              "  BUTTON:",
                              f"visible={b['visible']}",
                              f"disabled={b['disabled']}",
                              f"aria-disabled={b['ariaDisabled']!r}",
                              f"text={b['text']!r}"
                          )

                          if b["class"]:
                              print(
                                  "    class:",
                                  short(str(b["class"]), 200)
                              )

                          if b["id"]:
                              print(
                                  "    id:",
                                  b["id"]
                              )

                  print()
                  print("-" * 90)

              browser.close()
          PY

          python diagnose.py
