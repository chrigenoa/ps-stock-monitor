name: Shopify Playwright Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify-playwright-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Test Shopify Italian market
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          BASE_URL = "https://www.gtavi-thealbum.com"

          PRODUCT_PATH = (
              "/products/"
              "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          PRODUCT_URL = BASE_URL + PRODUCT_PATH

          print("=" * 80)
          print("SHOPIFY ITALIAN MARKET TEST")
          print("=" * 80)
          print()

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/153.0.0.0 Safari/537.36"
                  ),
              )

              page = context.new_page()

              # ----------------------------------------------------------
              # 1. Apriamo il dominio principale
              # ----------------------------------------------------------

              print("STEP 1 - OPEN SHOP")

              response = page.goto(
                  BASE_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(3000)

              print(f"HTTP STATUS: {response.status if response else 'N/A'}")
              print(f"CURRENT URL: {page.url}")

              # ----------------------------------------------------------
              # 2. Mostriamo il cookie localization PRIMA del cambio
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("COOKIES BEFORE LOCALIZATION")
              print("=" * 80)

              for cookie in context.cookies():
                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):
                      print(
                          f"{cookie['name']} = "
                          f"{cookie['value']}"
                      )

              # ----------------------------------------------------------
              # 3. Shopify Localization
              #
              # Shopify documenta il POST:
              #
              # /localization
              #
              # con:
              # country_code
              # language_code
              # _method=PUT
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("STEP 2 - FORCE ITALY")
              print("=" * 80)

              localization_result = page.evaluate(
                  """
                  async () => {

                      const form = new URLSearchParams();

                      form.append("_method", "PUT");
                      form.append("country_code", "IT");
                      form.append("language_code", "EN");

                      const response = await fetch(
                          "/localization",
                          {
                              method: "POST",
                              headers: {
                                  "Content-Type":
                                      "application/x-www-form-urlencoded"
                              },
                              body: form.toString(),
                              credentials: "same-origin",
                              redirect: "manual"
                          }
                      );

                      return {
                          status: response.status,
                          type: response.type,
                          location: response.headers.get("location")
                      };
                  }
                  """
              )

              print("Localization response:")
              print(localization_result)

              # ----------------------------------------------------------
              # 4. Aspettiamo che Shopify aggiorni i cookie
              # ----------------------------------------------------------

              page.wait_for_timeout(3000)

              print()
              print("=" * 80)
              print("COOKIES AFTER LOCALIZATION")
              print("=" * 80)

              for cookie in context.cookies():
                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):
                      print(
                          f"{cookie['name']} = "
                          f"{cookie['value']}"
                      )

              # ----------------------------------------------------------
              # 5. Ora apriamo direttamente il prodotto
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("STEP 3 - OPEN PRODUCT")
              print("=" * 80)

              response = page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print()
              print("HTTP STATUS:")
              print(
                  response.status
                  if response
                  else "N/A"
              )

              print()
              print("CURRENT URL:")
              print(page.url)

              print()
              print("PAGE TITLE:")
              print(page.title())

              # ----------------------------------------------------------
              # 6. Testo prodotto
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("RELEVANT PRODUCT TEXT")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              keywords = [
                  "sold out",
                  "sold-out",
                  "pre-order",
                  "pre order",
                  "add to cart",
                  "add to bag",
                  "123,99",
                  "124,98",
                  "124.98",
                  "€",
                  "$",
                  "ships",
              ]

              found_lines = set()

              for line in body_text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if any(
                      keyword.lower() in line.lower()
                      for keyword in keywords
                  ):
                      found_lines.add(line)

              for line in sorted(found_lines):
                  print(repr(line))

              # ----------------------------------------------------------
              # 7. Pulsanti visibili
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("VISIBLE BUTTONS")
              print("=" * 80)

              buttons = page.locator("button")

              for i in range(buttons.count()):

                  button = buttons.nth(i)

                  try:

                      if not button.is_visible():
                          continue

                      text = button.inner_text().strip()

                      disabled = button.is_disabled()

                      print(
                          f"BUTTON {i}: "
                          f"text={text!r} "
                          f"disabled={disabled}"
                      )

                  except Exception as e:

                      print(
                          f"BUTTON {i}: "
                          f"unable to inspect: {e}"
                      )

              # ----------------------------------------------------------
              # 8. Controllo HTML
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("PRODUCT HTML CHECK")
              print("=" * 80)

              html = page.locator("body").inner_html()

              checks = [
                  "Sold out",
                  "Sold Out",
                  "sold out",
                  "Pre-Order",
                  "Pre-order",
                  "Pre-Order Now",
                  "Add To Cart",
                  "Add to cart",
                  "123,99",
                  "€123,99",
                  "124.98",
                  "$124.98",
              ]

              for check in checks:

                  print(
                      f"{check!r}: "
                      f"{check.lower() in html.lower()}"
                  )

              # ----------------------------------------------------------
              # 9. Cookie finale
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("FINAL LOCALIZATION COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):

                      print(
                          f"{cookie['name']} = "
                          f"{cookie['value']}"
                      )

              print()
              print("=" * 80)
              print("END")
              print("=" * 80)

              browser.close()

          PY
