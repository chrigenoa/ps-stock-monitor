name: Shopify Market Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify-market-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Shopify market diagnostic
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright


          PRODUCT_URL = (
              "https://www.gtavi-thealbum.com/"
              "en-eu/products/"
              "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          BASE_URL = "https://www.gtavi-thealbum.com"

          LOCALIZATION_JS_URL = (
              BASE_URL
              + "/cdn/shop/t/5/assets/localization-form.js"
          )


          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/153.0.0.0 Safari/537.36"
                  ),
              )

              page = context.new_page()


              # --------------------------------------------------
              # OPEN PRODUCT
              # --------------------------------------------------

              print("=" * 80)
              print("OPENING EU PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print()
              print("CURRENT URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(page.title())


              # --------------------------------------------------
              # INITIAL COOKIES
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("INITIAL LOCALIZATION COOKIES")
              print("=" * 80)

              for cookie in context.cookies():
                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):
                      print(
                          cookie["name"],
                          "=",
                          cookie["value"],
                      )


              # --------------------------------------------------
              # LOCALIZATION FORM
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("LOCALIZATION FORM")
              print("=" * 80)

              localization_form = page.locator(
                  'form[action="/localization"]'
              )

              print(
                  "Localization forms:",
                  localization_form.count(),
              )

              if localization_form.count() > 0:

                  form = localization_form.first

                  print()
                  print("FORM HTML:")

                  print(
                      form.evaluate(
                          "el => el.outerHTML.substring(0, 12000)"
                      )
                  )

                  print()
                  print("INPUTS:")

                  inputs = form.locator("input")

                  for i in range(inputs.count()):

                      inp = inputs.nth(i)

                      print(
                          f"INPUT {i}: "
                          f"name={inp.get_attribute('name')!r} "
                          f"type={inp.get_attribute('type')!r} "
                          f"value={inp.get_attribute('value')!r}"
                      )

                  print()
                  print("BUTTONS:")

                  buttons = form.locator("button")

                  for i in range(buttons.count()):

                      button = buttons.nth(i)

                      try:

                          print(
                              f"BUTTON {i}: "
                              f"text={button.inner_text().strip()!r} "
                              f"name={button.get_attribute('name')!r} "
                              f"value={button.get_attribute('value')!r} "
                              f"type={button.get_attribute('type')!r}"
                          )

                      except Exception:
                          pass


              # --------------------------------------------------
              # ITALY ELEMENT
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("ITALY ELEMENT")
              print("=" * 80)

              italy = page.get_by_text(
                  "Italy",
                  exact=True,
              )

              print(
                  "Italy elements:",
                  italy.count(),
              )

              for i in range(
                  min(italy.count(), 5)
              ):

                  element = italy.nth(i)

                  try:

                      print()
                      print(
                          f"ITALY {i}:"
                      )

                      print(
                          element.evaluate(
                              """
                              el => {
                                  let p = el;
                                  let result = [];

                                  for (
                                      let i = 0;
                                      i < 5 && p;
                                      i++,
                                      p = p.parentElement
                                  ) {
                                      result.push({
                                          tag: p.tagName,
                                          id: p.id,
                                          class: p.className,
                                          outer:
                                              p.outerHTML
                                              .substring(0, 3000)
                                      });
                                  }

                                  return result;
                              }
                              """
                          )
                      )

                  except Exception as e:

                      print(
                          "ERROR:",
                          repr(e),
                      )


              # --------------------------------------------------
              # LOCALIZATION JAVASCRIPT
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("LOCALIZATION JS")
              print("=" * 80)

              try:

                  response = page.request.get(
                      LOCALIZATION_JS_URL,
                      timeout=30000,
                  )

                  print(
                      "HTTP:",
                      response.status,
                  )

                  js_text = response.text()

                  print()
                  print(js_text[:20000])

              except Exception as e:

                  print(
                      "ERROR:",
                      repr(e),
                  )


              # --------------------------------------------------
              # CLICK ITALY
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("SELECTING ITALY")
              print("=" * 80)

              try:

                  italy = page.get_by_text(
                      "Italy",
                      exact=True,
                  ).first

                  print(
                      "Visible:",
                      italy.is_visible(),
                  )

                  print(
                      "Enabled:",
                      italy.is_enabled(),
                  )

                  print(
                      "Clicking Italy..."
                  )

                  italy.click(
                      force=True,
                  )

                  page.wait_for_timeout(5000)

                  print()
                  print("AFTER ITALY CLICK")

                  print(
                      "URL:",
                      page.url,
                  )

                  print()
                  print("COOKIES:")

                  for cookie in context.cookies():

                      if cookie["name"] in (
                          "localization",
                          "cart_currency",
                      ):

                          print(
                              cookie["name"],
                              "=",
                              cookie["value"],
                          )


                  print()
                  print("PRODUCT TEXT:")

                  body_text = page.locator(
                      "body"
                  ).inner_text()

                  for line in body_text.splitlines():

                      line = line.strip()

                      if not line:
                          continue

                      if any(
                          x.lower() in line.lower()
                          for x in [
                              "sold out",
                              "pre-order",
                              "pre order",
                              "add to cart",
                              "123,99",
                              "124.98",
                              "$124.98",
                              "€123,99",
                              "italy",
                          ]
                      ):

                          print(
                              repr(line)
                          )

              except Exception as e:

                  print(
                      "ITALY CLICK ERROR:",
                      repr(e),
                  )


              # --------------------------------------------------
              # CHECK LOCALIZATION FORM AFTER CLICK
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("LOCALIZATION FORM AFTER ITALY CLICK")
              print("=" * 80)

              try:

                  form = page.locator(
                      'form[action="/localization"]'
                  ).first

                  if form.count() > 0:

                      print(
                          form.evaluate(
                              "el => el.outerHTML.substring(0, 12000)"
                          )
                      )

              except Exception as e:

                  print(
                      "FORM ERROR:",
                      repr(e),
                  )


              # --------------------------------------------------
              # FINAL COOKIES
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("FINAL COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):

                      print(
                          cookie["name"],
                          "=",
                          cookie["value"],
                      )


              # --------------------------------------------------
              # FINAL PRODUCT STATE
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("FINAL PRODUCT STATE")
              print("=" * 80)

              print(
                  "URL:",
                  page.url,
              )

              print(
                  "TITLE:",
                  page.title(),
              )

              body_text = page.locator(
                  "body"
              ).inner_text()

              for line in body_text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if any(
                      x.lower() in line.lower()
                      for x in [
                          "sold out",
                          "pre-order",
                          "pre order",
                          "add to cart",
                          "123,99",
                          "124.98",
                          "$124.98",
                          "€123,99",
                          "ships:",
                      ]
                  ):

                      print(
                          repr(line)
                      )


              # --------------------------------------------------
              # END
              # --------------------------------------------------

              print()
              print("=" * 80)
              print("END")
              print("=" * 80)

              browser.close()

          PY
