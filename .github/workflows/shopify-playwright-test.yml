name: Shopify Playwright Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify-playwright-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Test Shopify EU storefront
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = (
              "https://www.gtavi-thealbum.com/"
              "en-eu/products/"
              "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          print("=" * 80)
          print("SHOPIFY PLAYWRIGHT EU TEST")
          print("=" * 80)
          print(f"TARGET URL: {URL}")
          print()

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/153.0.0.0 Safari/537.36"
                  ),
              )

              page = context.new_page()

              print("Navigating...")
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print()
              print("=" * 80)
              print("CURRENT URL")
              print("=" * 80)
              print(page.url)

              print()
              print("=" * 80)
              print("PAGE TITLE")
              print("=" * 80)
              print(page.title())

              print()
              print("=" * 80)
              print("RELEVANT PRODUCT TEXT")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              keywords = [
                  "sold out",
                  "sold-out",
                  "pre-order",
                  "pre order",
                  "add to cart",
                  "add to bag",
                  "123,99",
                  "124,98",
                  "€",
                  "$",
                  "ships",
              ]

              found_lines = set()

              for line in body_text.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if any(
                      keyword.lower() in line.lower()
                      for keyword in keywords
                  ):
                      found_lines.add(line)

              for line in sorted(found_lines):
                  print(repr(line))

              print()
              print("=" * 80)
              print("VISIBLE BUTTONS")
              print("=" * 80)

              buttons = page.locator("button")

              for i in range(buttons.count()):
                  button = buttons.nth(i)

                  try:
                      if not button.is_visible():
                          continue

                      text = button.inner_text().strip()
                      disabled = button.is_disabled()

                      print(
                          f"BUTTON {i}: "
                          f"text={text!r} "
                          f"disabled={disabled}"
                      )

                  except Exception as e:
                      print(
                          f"BUTTON {i}: "
                          f"unable to inspect: {e}"
                      )

              print()
              print("=" * 80)
              print("LINKS")
              print("=" * 80)

              links = page.locator("a")

              for i in range(min(links.count(), 100)):
                  link = links.nth(i)

                  try:
                      if not link.is_visible():
                          continue

                      text = link.inner_text().strip()
                      href = link.get_attribute("href")

                      if text:
                          print(
                              f"LINK {i}: "
                              f"text={text!r} "
                              f"href={href!r}"
                          )

                  except Exception:
                      pass

              print()
              print("=" * 80)
              print("COOKIES")
              print("=" * 80)

              cookies = context.cookies()

              for cookie in cookies:
                  name = cookie.get("name")
                  value = cookie.get("value")

                  # Non stampiamo valori potenzialmente sensibili.
                  if name:
                      print(
                          f"COOKIE: {name} "
                          f"(value length={len(value)})"
                      )

              print()
              print("=" * 80)
              print("PRODUCT HTML CHECK")
              print("=" * 80)

              html = page.locator("body").inner_html()

              checks = [
                  "Sold out",
                  "Sold Out",
                  "sold out",
                  "Pre-Order",
                  "Pre-order",
                  "Add To Cart",
                  "Add to cart",
                  "123,99",
                  "124.98",
                  "$124.98",
                  "€123,99",
              ]

              for check in checks:
                  print(
                      f"{check!r}: "
                      f"{check.lower() in html.lower()}"
                  )

              print()
              print("=" * 80)
              print("END")
              print("=" * 80)

              browser.close()
          PY
