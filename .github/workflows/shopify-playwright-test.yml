name: Shopify Playwright Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Inspect product page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://www.gtavi-thealbum.com/en-eu/products/grand-theft-auto-vi-the-album-limited-edition-vinyl"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              page = browser.new_page(
                  locale="en-US",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(3000)

              print("=" * 80)
              print("SHOPIFY PLAYWRIGHT DIAGNOSTIC")
              print("=" * 80)

              print("\nPAGE TITLE:")
              print(page.title())

              print("\nVISIBLE TEXT AROUND PRODUCT:")

              body_text = page.locator("body").inner_text()

              for line in body_text.splitlines():
                  line = line.strip()

                  if line and any(
                      x.lower() in line.lower()
                      for x in [
                          "sold out",
                          "add to cart",
                          "pre-order",
                          "123,99",
                          "124",
                      ]
                  ):
                      print(repr(line))

              print("\nBUTTONS:")

              buttons = page.locator("button")

              for i in range(buttons.count()):

                  button = buttons.nth(i)

                  try:
                      if not button.is_visible():
                          continue

                      text = button.inner_text().strip()
                      disabled = button.is_disabled()

                      print(
                          f"BUTTON {i}: "
                          f"text={text!r} "
                          f"disabled={disabled}"
                      )

                  except Exception:
                      pass

              print("\nINPUTS:")

              inputs = page.locator("input")

              for i in range(inputs.count()):

                  element = inputs.nth(i)

                  try:
                      if not element.is_visible():
                          continue

                      print(
                          f"INPUT {i}: "
                          f"type={element.get_attribute('type')!r} "
                          f"name={element.get_attribute('name')!r} "
                          f"value={element.get_attribute('value')!r}"
                      )

                  except Exception:
                      pass

              browser.close()

          print("\n" + "=" * 80)
          print("END")
          print("=" * 80)
          PY
