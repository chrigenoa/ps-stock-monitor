name: Shopify Market Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify-market-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Inspect Shopify market selector
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          BASE_URL = "https://www.gtavi-thealbum.com"

          PRODUCT_URL = (
              BASE_URL
              + "/en-eu/products/"
              + "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="it-IT",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              # ----------------------------------------------------------
              # OPEN EU PRODUCT URL
              # ----------------------------------------------------------

              print("=" * 80)
              print("OPENING EU PRODUCT")
              print("=" * 80)

              page.goto(
                  PRODUCT_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              print()
              print("CURRENT URL:")
              print(page.url)

              print()
              print("TITLE:")
              print(page.title())

              # ----------------------------------------------------------
              # COOKIES
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("LOCALIZATION COOKIES")
              print("=" * 80)

              for cookie in context.cookies():

                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):

                      print(
                          cookie["name"],
                          "=",
                          cookie["value"]
                      )

              # ----------------------------------------------------------
              # ALL LINKS CONTAINING COUNTRY / MARKET / LANGUAGE
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("POSSIBLE MARKET / COUNTRY LINKS")
              print("=" * 80)

              links = page.locator("a")

              for i in range(links.count()):

                  link = links.nth(i)

                  try:

                      href = link.get_attribute("href")

                      text = link.inner_text().strip()

                      if not href:
                          continue

                      combined = (
                          text
                          + " "
                          + href
                      ).lower()

                      keywords = [
                          "ital",
                          "united states",
                          "states",
                          "country",
                          "market",
                          "local",
                          "currency",
                          "europe",
                          "france",
                          "germany",
                          "spain",
                          "united kingdom",
                          "canada",
                          "usd",
                          "eur",
                          "gbp",
                      ]

                      if any(
                          keyword in combined
                          for keyword in keywords
                      ):

                          print(
                              f"LINK {i}: "
                              f"text={text!r} "
                              f"href={href!r}"
                          )

                  except Exception:
                      pass

              # ----------------------------------------------------------
              # ALL FORMS
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("FORMS")
              print("=" * 80)

              forms = page.locator("form")

              for i in range(forms.count()):

                  form = forms.nth(i)

                  try:

                      action = form.get_attribute("action")

                      method = form.get_attribute("method")

                      print(
                          f"FORM {i}: "
                          f"method={method!r} "
                          f"action={action!r}"
                      )

                      selects = form.locator("select")

                      for j in range(selects.count()):

                          select = selects.nth(j)

                          print(
                              f"  SELECT {j}: "
                              f"name={select.get_attribute('name')!r}"
                          )

                          options = select.locator("option")

                          for k in range(options.count()):

                              option = options.nth(k)

                              print(
                                  "    OPTION:",
                                  f"text={option.inner_text().strip()!r}",
                                  f"value={option.get_attribute('value')!r}"
                              )

                  except Exception:
                      pass

              # ----------------------------------------------------------
              # SELECT ELEMENTS ON ENTIRE PAGE
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("ALL SELECT ELEMENTS")
              print("=" * 80)

              selects = page.locator("select")

              for i in range(selects.count()):

                  select = selects.nth(i)

                  try:

                      print(
                          f"SELECT {i}: "
                          f"name={select.get_attribute('name')!r} "
                          f"id={select.get_attribute('id')!r}"
                      )

                      options = select.locator("option")

                      for j in range(options.count()):

                          option = options.nth(j)

                          print(
                              f"  OPTION {j}: "
                              f"text={option.inner_text().strip()!r} "
                              f"value={option.get_attribute('value')!r}"
                          )

                  except Exception:
                      pass

              # ----------------------------------------------------------
              # ELEMENTS CONTAINING COUNTRY
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("ELEMENTS CONTAINING COUNTRY / REGION")
              print("=" * 80)

              body = page.locator("body")

              country_texts = [
                  "United States",
                  "Italy",
                  "Italia",
                  "USD",
                  "EUR",
                  "Europe",
                  "Country",
                  "Region",
              ]

              for text in country_texts:

                  try:

                      locator = page.get_by_text(
                          text,
                          exact=False
                      )

                      count = locator.count()

                      print(
                          f"{text!r}: "
                          f"{count} element(s)"
                      )

                      for i in range(min(count, 5)):

                          element = locator.nth(i)

                          try:

                              print(
                                  "  ",
                                  element.evaluate(
                                      """
                                      el => ({
                                          tag: el.tagName,
                                          text: el.innerText,
                                          outer: el.outerHTML.substring(0, 1000)
                                      })
                                      """
                                  )
                              )

                          except Exception:
                              pass

                  except Exception:
                      pass

              # ----------------------------------------------------------
              # SEARCH RAW HTML FOR LOCALIZATION ENDPOINTS
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("LOCALIZATION REFERENCES IN HTML")
              print("=" * 80)

              html = page.locator("html").inner_html()

              html_lower = html.lower()

              search_terms = [
                  "/localization",
                  "country_code",
                  "localization",
                  "country-selector",
                  "country_selector",
                  "market",
                  "markets",
                  "geolocation",
                  "currency",
              ]

              for term in search_terms:

                  print(
                      f"{term!r}: "
                      f"{term.lower() in html_lower}"
                  )

              # ----------------------------------------------------------
              # NETWORK REQUESTS
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("NAVIGATION / LOCALIZATION REQUESTS")
              print("=" * 80)

              # Navigate again while recording requests.
              requests_seen = []

              def on_request(request):

                  url = request.url.lower()

                  interesting = [
                      "localization",
                      "country",
                      "market",
                      "geolocation",
                      "currency",
                  ]

                  if any(
                      x in url
                      for x in interesting
                  ):

                      requests_seen.append(
                          (
                              request.method,
                              request.url
                          )
                      )

              page.on(
                  "request",
                  on_request
              )

              page.reload(
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(5000)

              for method, url in requests_seen:

                  print(
                      method,
                      url
                  )

              # ----------------------------------------------------------
              # FINAL STATE
              # ----------------------------------------------------------

              print()
              print("=" * 80)
              print("FINAL STATE")
              print("=" * 80)

              print(
                  "URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              body_text = page.locator(
                  "body"
              ).inner_text()

              for line in body_text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if any(
                      x.lower() in line.lower()
                      for x in [
                          "sold out",
                          "pre-order",
                          "pre order",
                          "add to cart",
                          "123,99",
                          "124.98",
                          "$124.98",
                          "€123,99",
                      ]
                  ):

                      print(
                          repr(line)
                      )

              print()
              print("=" * 80)
              print("END")
              print("=" * 80)

              browser.close()

          PY
