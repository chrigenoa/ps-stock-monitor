name: Shopify Stock Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Shopify diagnostic
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = (
              "https://www.gtavi-thealbum.com/en-eu/products/"
              "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  locale="en-US",
                  timezone_id="Europe/Rome",
                  viewport={
                      "width": 1440,
                      "height": 1000,
                  },
              )

              page = context.new_page()

              print("=" * 80)
              print("1. OPEN PAGE")
              print("=" * 80)

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=30000,
              )

              page.wait_for_timeout(2500)

              print("URL:", page.url)

              form = page.locator(
                  'form[action="/localization"]'
              ).first

              print()
              print("=" * 80)
              print("2. LOCALIZATION FORM")
              print("=" * 80)

              print("Form count:", form.count())

              country_input = form.locator(
                  'input[name="country_code"]'
              ).first

              print(
                  "country_code count:",
                  country_input.count()
              )

              if country_input.count() == 0:
                  print("STOP: country_code NOT FOUND")
                  browser.close()
                  raise SystemExit(1)

              print(
                  "country_code BEFORE:",
                  country_input.input_value()
              )

              print()
              print("=" * 80)
              print("3. SET ITALY WITH JAVASCRIPT")
              print("=" * 80)

              page.evaluate(
                  """
                  () => {
                      const input =
                          document.querySelector(
                              'form[action="/localization"] input[name="country_code"]'
                          );

                      if (!input) {
                          throw new Error(
                              "country_code input not found"
                          );
                      }

                      input.value = "IT";

                      const form = input.closest("form");

                      if (!form) {
                          throw new Error(
                              "localization form not found"
                          );
                      }

                      form.submit();
                  }
                  """
              )

              print("JavaScript form.submit() executed.")

              page.wait_for_timeout(4000)

              print()
              print("=" * 80)
              print("4. AFTER LOCALIZATION")
              print("=" * 80)

              print("URL:", page.url)

              print()
              print("COOKIES:")

              for cookie in context.cookies():

                  if cookie["name"] in (
                      "localization",
                      "cart_currency",
                  ):
                      print(
                          cookie["name"],
                          "=",
                          cookie["value"]
                      )

              print()
              print("=" * 80)
              print("5. MARKET CONTENT")
              print("=" * 80)

              body_text = page.locator("body").inner_text()

              print(
                  "Contains €123,99:",
                  "€123,99" in body_text
              )

              print(
                  "Contains 123,99:",
                  "123,99" in body_text
              )

              print()
              print("RELEVANT LINES:")

              for line in body_text.splitlines():

                  line = line.strip()
                  lower = line.lower()

                  if (
                      "123,99" in line
                      or "sold out" in lower
                      or "pre-order" in lower
                      or "ships:" in lower
                      or "select options" in lower
                  ):
                      print(repr(line))

              print()
              print("=" * 80)
              print("6. PRODUCT")
              print("=" * 80)

              h1 = page.locator("h1").first

              print("H1 count:", h1.count())

              if h1.count() > 0:
                  print(
                      "H1:",
                      repr(h1.inner_text())
                  )

              print()
              print("=" * 80)
              print("7. PRODUCT ANCestors")
              print("=" * 80)

              if h1.count() > 0:

                  for level in range(1, 8):

                      ancestor = h1.locator(
                          "xpath=" + "/.." * level
                      ).first

                      if ancestor.count() == 0:
                          continue

                      try:

                          tag = ancestor.evaluate(
                              "(el) => el.tagName"
                          )

                          classes = ancestor.get_attribute(
                              "class"
                          )

                          text = ancestor.inner_text()

                          print()
                          print("LEVEL:", level)
                          print("TAG:", tag)
                          print("CLASS:", classes)
                          print(
                              "TEXT:",
                              repr(text[:1500])
                          )

                      except Exception as e:

                          print(
                              "Ancestor error:",
                              e
                          )

              print()
              print("=" * 80)
              print("8. PRODUCT BUTTONS")
              print("=" * 80)

              if h1.count() > 0:

                  for level in range(1, 7):

                      ancestor = h1.locator(
                          "xpath=" + "/.." * level
                      ).first

                      if ancestor.count() == 0:
                          continue

                      buttons = ancestor.locator(
                          "button"
                      )

                      if buttons.count() == 0:
                          continue

                      print()
                      print(
                          "LEVEL",
                          level,
                          "BUTTONS:",
                          buttons.count()
                      )

                      for i in range(
                          min(buttons.count(), 20)
                      ):

                          button = buttons.nth(i)

                          try:

                              print(
                                  "BUTTON",
                                  i,
                                  "| visible=",
                                  button.is_visible(),
                                  "| disabled=",
                                  button.is_disabled(),
                                  "| text=",
                                  repr(
                                      button.inner_text()
                                  )
                              )

                          except Exception as e:

                              print(
                                  "button error:",
                                  e
                              )

              print()
              print("=" * 80)
              print("DIAGNOSTIC COMPLETE")
              print("=" * 80)

              browser.close()
          PY
