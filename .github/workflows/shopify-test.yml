name: Shopify Stock Test

on:
  workflow_dispatch:

jobs:
  test-shopify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Shopify adapter
        run: |
          python - <<'PY'
          from sites.shopify import check_stock

          url = (
              "https://www.gtavi-thealbum.com/en-eu/products/"
              "grand-theft-auto-vi-the-album-limited-edition-vinyl"
          )

          print("=" * 80)
          print("SHOPIFY STOCK ADAPTER TEST")
          print("=" * 80)
          print()
          print("URL:")
          print(url)
          print()
          print("Running check_stock()...")
          print()

          result = check_stock(url)

          print("=" * 80)
          print("RESULT")
          print("=" * 80)
          print(result)
          print("=" * 80)

          if result != "OUT_OF_STOCK":
              print()
              print("TEST FAILED")
              print(
                  "Expected OUT_OF_STOCK but received:",
                  result,
              )
              raise SystemExit(1)

          print()
          print("TEST PASSED")
          print("Shopify correctly reports OUT_OF_STOCK.")
          PY
