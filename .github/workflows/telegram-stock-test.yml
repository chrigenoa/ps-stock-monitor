name: Telegram Stock Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-stock-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send simulated stock notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          product_name = "DualSense Wolverine Adamantium"
          product_url = "https://direct.playstation.com/it-it/buy-accessories/dualsense-wireless-controller-marvels-wolverine-adamantium-limited-edition-for-ps5-pc-mac-mobile"

          message = (
              "🟢 DISPONIBILE\n\n"
              f"{product_name}\n\n"
              f"{product_url}"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": message,
              },
              timeout=20,
          )

          print("HTTP:", response.status_code)
          print("Response:", response.text)

          response.raise_for_status()

          data = response.json()

          if not data.get("ok"):
              raise RuntimeError("Telegram API returned ok=false")

          print("Telegram stock notification test: OK")
          PY
